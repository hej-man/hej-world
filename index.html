// A spot on a cave floor under (x, z), or null: scans up from the cave floor for air with ground below.
function caveFloorAt(x, z) {
  const T = terrainFns, top = T.surfaceHeight(x, z) - 6;
  for (let y = WORLD.caveFloor + 1.5; y < top; y += 1.5) {
    if (sampleField(x, y, z) < -0.6 && sampleField(x, y + 1.5, z) < -0.6) {
      const g = groundAt(x, z, y);
      if (g && y - g.point.y < 6 && g.face.normal.y > 0.7) return g;
      return null;
    }
  }
  return null;
}

function findAnimalSpot(home, rand, awayFromPlayer) {
  const T = terrainFns, S = WORLD.size, L = T.ledge;
  for (let tries = 0; tries < (home === 'cave' ? 160 : 50); tries++) {
    const x = 10 + rand() * (S - 20), z = 10 + rand() * (S - 20);
    if (awayFromPlayer && Math.hypot(x - player.position.x, z - player.position.z) < 50) continue;
    if (home === 'cave') {
      if (Math.hypot(x - L.x, z - L.z) < 40 || T.volcanoInfluence(x, z) > 0.2) continue; // not right at the start
      const g = caveFloorAt(x, z);
      if (g) return { x, y: g.point.y, z };
      continue;
    }
    const W = T.waterAt(x, z);
    const g = groundAt(x, z);
    if (!g) continue;
    const y = g.point.y;
    if (y < W + 1.5 || y > 72 || g.face.normal.y < 0.8 || Math.abs(y - T.surfaceHeight(x, z)) > 3 || T.volcanoInfluence(x, z) > 0.25) continue;
    const fm = T.forestMask(x, z);
    if (home === 'meadow' && fm > 0.45) continue;
    if (home === 'forest' && fm < 0.4) continue;
    if (home === 'forest' && Math.hypot(x - L.x, z - L.z) < 45) continue; // keep wolves away from the starting ledge
    return { x, y, z };
  }
  return null;
}

function spawnHerd(kind, rand, awayFromPlayer) {
  const sp = SPECIES[kind];
  const spot = findAnimalSpot(sp.home, rand, awayFromPlayer);
  if (!spot) return 0;
  const n = sp.herd[0] + Math.floor(rand() * (sp.herd[1] - sp.herd[0] + 1));
  let made = 0;
  for (let i = 0; i < n * 3 && made < n; i++) {
    const x = spot.x + (rand() - 0.5) * 8, z = spot.z + (rand() - 0.5) * 8;
    const g = sp.home === 'cave' ? groundAt(x, z, spot.y + 2.5) : groundAt(x, z);
    if (!g || g.point.y < terrainFns.waterAt(x, z) + 1 || g.face.normal.y < 0.7 || Math.abs(g.point.y - spot.y) > 4) continue;
    spawnAnimal(kind, x, g.point.y, z, rand);
    made++;
  }
  return made;
}

function spawnAnimals(seed) {
  animalRand = mulberry32(seed * 17 + 11);
  const area = (WORLD.size / 256) ** 2;
  for (const [kind, sp] of Object.entries(SPECIES)) {
    population[kind] = Math.max(1, Math.round(sp.per * area));
    for (let tries = 0; tries < 12 && animals.filter((a) => a.kind === kind).length < population[kind]; tries++) spawnHerd(kind, animalRand, false);
  }
  return animals.length;
}

// Moves an animal if the spot is walkable: on land, not too steep, no step over 0.9 m, no tree, rock or block in the way.
function tryMoveAnimal(a, mx, mz) {
  const S = WORLD.size, nx = a.x + mx, nz = a.z + mz;
  if (nx < 3 || nz < 3 || nx > S - 3 || nz > S - 3) return false;
  const g = groundAt(nx, nz, a.y + 2.2);
  if (!g || g.point.y < terrainFns.waterAt(nx, nz) + 0.2 || g.face.normal.y < 0.6 || Math.abs(g.point.y - a.y) > 0.9) return false;
  const gy = g.point.y;
  if (lavaFlows.length && terrainFns.volcanoInfluence(nx, nz) > 0.25 && lavaAt(nx, gy, nz, 0.5)) return false;
  const list = obstacleGrid.get(cellKey(Math.floor(nx / CELL), Math.floor(nz / CELL)));
  if (list) for (const o of list) {
    if (o.min) { if (nx > o.min.x - a.sp.r * 0.5 && nx < o.max.x + a.sp.r * 0.5 && nz > o.min.z - a.sp.r * 0.5 && nz < o.max.z + a.sp.r * 0.5 && gy + 0.3 < o.max.y && gy + a.sp.h > o.min.y) return false; }
    else if (Math.hypot(nx - o.x, nz - o.z) < o.r + a.sp.r * 0.6 && (o.type !== 'sphere' || o.y + o.r > gy + 0.3)) return false;
  }
  a.x = nx; a.z = nz; a.y = gy;
  return true;
}

function hurtAnimal(a, dmg, dx, dz) {
  a.hp -= dmg;
  a.hurtT = 0.25;
  const len = Math.hypot(dx, dz) || 1;
  a.kx = dx / len * 6; a.kz = dz / len * 6;
  if (a.sp.hostile) a.aggro = 20; else a.flee = 6;
  if (a.hp <= 0) killAnimal(a);
}

function killAnimal(a) {
  world.remove(a.group);
  a.mats.forEach((m) => m.dispose());
  animals.splice(animals.indexOf(a), 1);
  if (currentTarget?.animal === a) currentTarget = null;
  if (creative) return;
  const got = [];
  for (const [id, lo, hi] of a.sp.drops) {
    const n = lo + Math.floor(Math.random() * (hi - lo + 1));
    if (n > 0) got.push([id, n]);
  }
  give(got);
}

function updateAnimals(dt) {
  const px = player.position.x, pz = player.position.z, pfeet = player.position.y - FOOT_OFFSET;
  for (const a of [...animals]) {
    const sp = a.sp;
    const dx = px - a.x, dz = pz - a.z, dist = Math.hypot(dx, dz) || 1e-3, dy = pfeet - a.y;
    if (dist > 140) continue; // far away animals stay put
    a.timer -= dt; a.hurtT -= dt; a.attackCd -= dt; a.flee -= dt; a.aggro -= dt;

    let wx = 0, wz = 0, speed = 0;
    const hunting = sp.hostile && !creative && gameState === 'playing' && Math.abs(dy) < 6 && (dist < sp.hostile || (a.aggro > 0 && dist < 30));
    if (hunting) {
      a.mode = 'chase'; wx = dx / dist; wz = dz / dist; speed = sp.run;
      if (dist < 1.3 + sp.r && Math.abs(dy) < 1.8 && a.attackCd <= 0) {
        a.attackCd = sp.attackEvery || 1.1;
        damagePlayer(sp.bite, `were killed by a ${sp.name.toLowerCase()}`);
        const k = sp.knock || 6;
        player.velocity.x += dx / dist * k; player.velocity.z += dz / dist * k; player.velocity.y = Math.max(player.velocity.y, 3);
      }
      if (dist < 1.1 + sp.r) speed = 0;
    } else if (a.flee > 0 || (sp.shy && dist < sp.shy && Math.abs(dy) < 5)) {
      a.mode = 'flee'; wx = -dx / dist; wz = -dz / dist; speed = sp.run;
    } else {
      if (a.timer <= 0) {
        if (animalRand() < 0.45) { a.mode = 'idle'; a.timer = 2 + animalRand() * 5; }
        else { a.mode = 'walk'; a.angle = animalRand() * Math.PI * 2; a.timer = 2 + animalRand() * 4; }
      }
      if (a.mode === 'walk') { wx = -Math.sin(a.angle); wz = -Math.cos(a.angle); speed = sp.walk; }
      else a.mode = 'idle';
    }

    // move (plus knockback), steering around things in the way
    const decay = Math.exp(-6 * dt);
    a.kx *= decay; a.kz *= decay;
    let mx = (wx * speed + a.kx) * dt, mz = (wz * speed + a.kz) * dt;
    let moved = 0;
    if (mx || mz) {
      if (tryMoveAnimal(a, mx, mz)) moved = Math.hypot(mx, mz);
      else {
        let ok = false;
        for (const turn of [0.8, -0.8, 1.6, -1.6]) {
          const c = Math.cos(turn), s = Math.sin(turn);
          if (tryMoveAnimal(a, mx * c - mz * s, mx * s + mz * c)) { ok = true; moved = Math.hypot(mx, mz); wx = (mx * c - mz * s); wz = (mx * s + mz * c); break; }
        }
        if (!ok && a.mode === 'walk') { a.angle += Math.PI * (0.5 + animalRand()); a.timer = 1 + animalRand() * 2; }
        if (!ok && a.mode === 'flee') a.flee = Math.min(a.flee, 0.5);
      }
    }
    if (!moved) {
      // settle onto the ground (it might have been dug away)
      a.groundT -= dt;
      if (a.groundT <= 0) {
        a.groundT = 0.4;
        const g = groundAt(a.x, a.z, a.y + 1.2);
        if (g) a.y = g.point.y; else a.y -= 1;
      }
    }

    // face where it's going
    if (wx || wz) {
      const target = Math.atan2(-wx, -wz);
      const diff = Math.atan2(Math.sin(target - a.facing), Math.cos(target - a.facing));
      a.facing += diff * Math.min(1, dt * 6);
    }

    // animation: legs swing in diagonal pairs, grazers lower their heads while idle, rabbits hop
    const hs = moved / Math.max(dt, 1e-4);
    a.phase += dt * hs * (sp.hop ? 3 : 6) / Math.max(0.6, sp.h);
    const sw = Math.sin(a.phase) * Math.min(1, hs / 2) * 0.7;
    a.legs.forEach((l, i) => { l.rotation.x = (i === 0 || i === 3) ? sw : -sw; });
    const headDown = a.mode === 'idle' && sp.graze && Math.sin(a.timer * 0.9) > -0.3 ? -0.7 : 0;
    a.head.rotation.x += (headDown - a.head.rotation.x) * Math.min(1, dt * 4);
    const hop = sp.hop && hs > 0.2 ? Math.abs(Math.sin(a.phase)) * 0.25 : 0;
    a.group.position.set(a.x, a.y + hop, a.z);
    a.group.rotation.y = a.facing;
    const flash = a.hurtT > 0 ? 0.6 : 0;
    for (const m of a.mats) if (m.userData.flash !== flash) { m.userData.flash = flash; m.emissive.setRGB(flash, 0, 0); }
  }

  // top populations back up now and then, out of sight
  animalRespawnTimer -= dt;
  if (animalRespawnTimer <= 0) {
    animalRespawnTimer = 20;
    for (const kind of Object.keys(SPECIES)) {
      if (animals.filter((a) => a.kind === kind).length < population[kind]) { spawnHerd(kind, animalRand, true); break; }
    }
  }
}

// ---------------------------------------------------------------------------
// Interaction: aim, break, attack, place, eat, cast
// ---------------------------------------------------------------------------
const mouse = { left: false, right: false };
let testMode = false;                // lets headless tests act without pointer lock
let swingTime = 0, breakProgress = 0, breakKey = null, attackCd = 0, useCd = 0, warnCd = 0;
let currentTarget = null, aimWater = null;
const _aimO = new THREE.Vector3(), _aimD = new THREE.Vector3(), _eye = new THREE.Vector3(), _tv = new THREE.Vector3();

const outline = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1.02, 1.02, 1.02)),
  new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.6 }),
);
outline.visible = false;
scene.add(outline);

function raySphere(o, d, cx, cy, cz, r) {
  const ox = o.x - cx, oy = o.y - cy, oz = o.z - cz;
  const b = ox * d.x + oy * d.y + oz * d.z, c = ox * ox + oy * oy + oz * oz - r * r;
  const h = b * b - c;
  if (h < 0) return null;
  const sq = Math.sqrt(h);
  return -b - sq >= 0 ? -b - sq : -b + sq >= 0 ? 0 : null;
}

// What's under the crosshair, within reach of the player: terrain, a block, a tree/bush/boulder, or an animal.
function pickTarget() {
  camera.getWorldDirection(_aimD);
  _aimO.copy(camera.position);
  _eye.set(player.position.x, player.position.y + EYE_OFFSET, player.position.z);
  const t0 = Math.max(0, _tv.subVectors(_eye, _aimO).dot(_aimD)); // start level with the player (third person)
  const t1 = t0 + PLAYER.reach;
  let best = null;
  const th = raycastTerrain(_aimO, _aimD, t0, t1);
  if (th) best = { kind: 'terrain', t: th.distance, point: th.point.clone(), normal: th.face.normal.clone(), hit: th };
  const bh = voxelRay(_aimO, _aimD, t0, best ? best.t : t1);
  if (bh) best = { kind: 'block', t: bh.t, key: bh.key, cell: bh.cell, normal: new THREE.Vector3(...bh.normal), type: blocks.get(bh.key).type };
  const gx = Math.floor(player.position.x / CELL), gz = Math.floor(player.position.z / CELL);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const list = targetGrid.get(cellKey(gx + i, gz + j));
    if (list) for (const tg of list) for (const [cx, cy, cz, r] of tg.spheres) {
      const t = raySphere(_aimO, _aimD, cx, cy, cz, r);
      if (t !== null && t >= t0 - r && t <= (best ? best.t : t1)) best = { kind: tg.kind, t, target: tg };
    }
  }
  for (const a of animals) {
    if (Math.abs(a.x - player.position.x) > PLAYER.reach + 3 || Math.abs(a.z - player.position.z) > PLAYER.reach + 3) continue;
    const t = raySphere(_aimO, _aimD, a.x, a.y + a.sp.h * 0.55, a.z, Math.max(0.35, a.sp.r));
    if (t !== null && t >= t0 - 1 && t <= (best ? best.t : t1)) best = { kind: 'animal', t, animal: a };
  }
  return best;
}

// Where the aim ray first meets a water surface (sea or a lake) from above, or null.
function waterRay(o, d, t0, t1) {
  if (d.y > -1e-3) return null;
  const T = terrainFns, levels = [WORLD.waterLevel];
  for (const lk of T.lakes) if (Math.abs(lk.x - o.x) < lk.R * 2 + t1 && Math.abs(lk.z - o.z) < lk.R * 2 + t1) levels.push(lk.level);
  let best = null;
  for (const L of levels) {
    const t = (L - o.y) / d.y;
    if (t < t0 || t > t1 || (best && t > best.t)) continue;
    const x = o.x + d.x * t, z = o.z + d.z * t;
    if (Math.abs(T.waterAt(x, z) - L) > 0.01) continue;
    best = { t, point: new THREE.Vector3(x, L, z) };
  }
  return best;
}

function terrainMaterialAt(hit) {
  const p = hit.point, n = hit.face.normal;
  const edited = editedMaterialAt(p.x - n.x * 0.8, p.y - n.y * 0.8, p.z - n.z * 0.8);
  if (edited) return edited;
  const ch = hit.object.userData.chunk;
  const g = ch.render.geometry, vi = g.index.getX(hit.faceIndex * 3);
  if (g.attributes.tinfo.getZ(vi) < -0.5) return 'crystal';
  return naturalMaterial(p.x, p.y, p.z, n.y);
}

function materialOf(t) {
  switch (t.kind) {
    case 'tree': return 'wood';
    case 'bush': return 'plant';
    case 'rock': return 'stone';
    case 'block': return BLOCKS[t.type].mat;
    case 'terrain': return t.material || (t.material = terrainMaterialAt(t.hit));
  }
  return 'soft';
}

function targetName(t) {
  switch (t.kind) {
    case 'tree': return { pine: 'Pine tree', oak: 'Oak tree', birch: 'Birch tree' }[t.target.species];
    case 'bush': return 'Berry bush';
    case 'rock': return t.target.iron ? 'Iron-rich boulder' : 'Boulder';
    case 'block': return BLOCKS[t.type].name;
    case 'animal': return `${t.animal.sp.name}  ${Math.max(0, Math.ceil(t.animal.hp))}/${t.animal.sp.hp}`;
    case 'terrain': return { dirt: 'Dirt', sand: 'Sand', stone: 'Stone', crystal: 'Crystal', iron: 'Iron ore' }[materialOf(t)];
  }
  return '';
}

// Seconds to break something with the item in hand (Infinity = can't).
function breakTime(mat, def) {
  if (creative) return 0.12;
  const tool = def?.tool, tier = def?.tier || 0, speed = [1, 1, 1.6, 2.6][tier];
  switch (mat) {
    case 'wood': return tool === 'axe' ? 1.1 / speed : 2.6;
    case 'plant': return 0.35;
    case 'soft': return 0.5;
    case 'dirt': case 'sand': return tool === 'shovel' ? 0.4 / speed : 0.9;
    case 'stone': case 'crystal': return tool === 'pickaxe' ? 1.4 / speed : Infinity;
    case 'iron': return tool === 'pickaxe' && tier >= 2 ? 2 / speed : Infinity;
  }
  return 1;
}

// Adds [[id, count], ...] to the inventory and shows what you got.
function give(list) {
  if (creative) return;
  const got = [];
  let lost = 0;
  for (const [id, n] of list) {
    if (n <= 0) continue;
    const left = addItem(id, n);
    lost += left;
    if (n - left > 0) got.push(`+${n - left} ${ITEMS[id].name}`);
  }
  if (got.length || lost) toast(got.join('  ') + (lost ? '  (inventory full)' : ''));
}

const _hide = new THREE.Matrix4().makeScale(0, 0, 0);
function harvest(tg) {
  for (const [mesh, i] of tg.parts) { mesh.setMatrixAt(i, _hide); mesh.instanceMatrix.needsUpdate = true; }
  if (tg.obstacle) gridRemove(obstacleGrid, tg.obstacle);
  gridRemove(targetGrid, tg);
  const r = Math.random;
  if (tg.kind === 'tree') {
    give([
      ['log', 2 + Math.round(tg.scale * 2)],
      ['stick', 1 + Math.floor(r() * 2) + (tg.species === 'pine' ? 1 : 0)],
      ['apple', tg.species === 'oak' && r() < 0.5 ? 1 + Math.floor(r() * 2) : 0],
    ]);
  } else if (tg.kind === 'bush') {
    give([['berries', r() < 0.8 ? 1 + Math.floor(r() * 3) : 0], ['stick', 1]]);
  } else if (tg.kind === 'rock') {
    give(tg.iron ? [['stone', 1 + Math.round(tg.s)], ['iron_ore', 1 + Math.round(tg.s * 1.5)]] : [['stone', 2 + Math.round(tg.s * 2)]]);
  }
}

function doBreak(t) {
  if (t.kind === 'tree' || t.kind === 'bush' || t.kind === 'rock') { harvest(t.target); return; }
  if (t.kind === 'block') { const b = removeBlock(t.key); if (b) give([[b.type, 1]]); return; }
  if (t.kind === 'terrain') {
    const mat = materialOf(t);
    const center = t.point.clone().addScaledVector(t.normal, -0.6);
    const flipped = editTerrain(center, 1.9, false);
    if (!flipped) return;
    // plants standing on the removed ground come down with it
    const gx = Math.floor(center.x / CELL), gz = Math.floor(center.z / CELL);
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
      for (const tg of [...(targetGrid.get(cellKey(gx + i, gz + j)) || [])]) {
        if (Math.hypot(tg.x - center.x, tg.y - center.y, tg.z - center.z) < 2.6) harvest(tg);
      }
    }
    give(mat === 'crystal' ? [['crystal', 1 + Math.floor(Math.random() * 2)]] : mat === 'iron' ? [['iron_ore', 1], ['stone', Math.random() < 0.5 ? 1 : 0]] : [[mat, 1]]);
  }
}

// Where a block would go: the empty cell in front of the face you're looking at.
function placementCell(t) {
  if (!t || (t.kind !== 'terrain' && t.kind !== 'block')) return null;
  if (t.kind === 'block') return [t.cell[0] + t.normal.x, t.cell[1] + t.normal.y, t.cell[2] + t.normal.z];
  return [Math.floor(t.point.x + t.normal.x * 0.5), Math.floor(t.point.y + t.normal.y * 0.5), Math.floor(t.point.z + t.normal.z * 0.5)];
}

const _bmin = new THREE.Vector3(), _bmax = new THREE.Vector3(), _sg = new THREE.Line3(), _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();
function cellFree([x, y, z]) {
  if (x < 1 || z < 1 || y < 1 || x > WORLD.size - 2 || z > WORLD.size - 2 || y > WORLD.height - 2) return false;
  if (blocks.has(blockKey(x, y, z))) return false;
  // not inside the player
  _bmin.set(x, y, z); _bmax.set(x + 1, y + 1, z + 1);
  _sg.start.copy(player.position); _sg.end.copy(player.position); _sg.end.y -= PLAYER.segment;
  _p2.copy(_sg.start).clamp(_bmin, _bmax);
  for (let k = 0; k < 3; k++) { _sg.closestPointToPoint(_p2, true, _p1); _p2.copy(_p1).clamp(_bmin, _bmax); }
  _sg.closestPointToPoint(_p2, true, _p1);
  if (_p1.distanceTo(_p2) < PLAYER.radius - 0.02) return false;
  // not inside an animal
  return !animals.some((a) => a.x + a.sp.r * 0.6 > x && a.x - a.sp.r * 0.6 < x + 1 && a.z + a.sp.r * 0.6 > z && a.z - a.sp.r * 0.6 < z + 1 && a.y < y + 1 && a.y + a.sp.h > y);
}

function consumeSelected() {
  if (creative) return;
  const s = slots[selectedSlot];
  if (!s) return;
  if (!--s.count) slots[selectedSlot] = null;
  renderInventory();
}

// Right click on water: fill an empty bottle, or drink a few sips
function useWater() {
  const s = slots[selectedSlot];
  if (s?.id === 'bottle') {
    consumeSelected();
    give([['water_bottle', 1]]);
    useCd = 0.4;
    return;
  }
  if (stats.thirst > 99 && !creative) { toast("You're not thirsty"); return; }
  stats.thirst = Math.min(100, stats.thirst + 15);
  toast('Drank some water');
  useCd = 0.6;
}

// Right click
function useItem(t) {
  const s = slots[selectedSlot], def = s && ITEMS[s.id];
  // water in front of whatever you're aiming at: drink or fill a bottle, unless you're building
  if (aimWater && !(def && (def.place || def.terrain || def.food || def.drink || def.heal || def.mana || def.armour || def.wand))) { useWater(); return; }
  if (t?.kind === 'block' && BLOCKS[t.type].station && !(def && (def.place || def.terrain))) { setInventoryOpen(true); return; }
  if (!def) return;
  if (def.place) {
    const cell = placementCell(t);
    if (!cell || !cellFree(cell)) return;
    if (placeBlock(def.place, ...cell, buildShape)) consumeSelected();
  } else if (def.terrain) {
    if (!t || (t.kind !== 'terrain' && t.kind !== 'block')) return;
    const p = t.kind === 'terrain' ? t.point : new THREE.Vector3(t.cell[0] + 0.5, t.cell[1] + 0.5, t.cell[2] + 0.5).addScaledVector(t.normal, 0.5);
    const center = p.clone().addScaledVector(t.normal, 0.9);
    _sg.start.copy(player.position); _sg.end.copy(player.position); _sg.end.y -= PLAYER.segment;
    _sg.closestPointToPoint(center, true, _p1);
    if (_p1.distanceTo(center) < 1.9 + PLAYER.radius + 0.3) { toast('Too close to place ground here'); return; }
    if (editTerrain(center, 1.9, true, def.terrain)) consumeSelected();
  } else if (def.food) {
    if (stats.hunger > 99 && !creative) { toast("You're not hungry"); return; }
    stats.hunger = Math.min(100, stats.hunger + def.food);
    if (def.drink) stats.thirst = Math.min(100, stats.thirst + def.drink);
    if (def.heal) stats.health = Math.min(MAX_HEALTH, stats.health + def.heal);
    consumeSelected();
    toast(`Ate ${def.name.toLowerCase()}`);
    useCd = 0.5;
  } else if (def.drink) {
    if (stats.thirst > 99 && !creative) { toast("You're not thirsty"); return; }
    stats.thirst = Math.min(100, stats.thirst + def.drink);
    consumeSelected();
    if (def.leaves && !creative) addItem(def.leaves, 1);
    toast(`Drank ${def.name.toLowerCase()}`);
    useCd = 0.5;
  } else if (def.heal) {
    if (stats.health >= MAX_HEALTH) { toast('Health is already full'); return; }
    stats.health = Math.min(MAX_HEALTH, stats.health + def.heal);
    consumeSelected();
    useCd = 0.5;
  } else if (def.mana) {
    if (stats.mana >= 100) { toast('Mana is already full'); return; }
    stats.mana = Math.min(100, stats.mana + def.mana);
    consumeSelected();
    useCd = 0.5;
  } else if (def.wand) {
    castBolt();
  } else if (def.armour) {
    if (stats.armour >= def.armour) { toast('Already wearing armour'); return; }

// Wand bolts
const bolts = [];
const boltGeo = new THREE.IcosahedronGeometry(0.16, 0);
const boltMat = new THREE.MeshBasicMaterial({ color: 0x9fe8ff });
const _bd = new THREE.Vector3();
function castBolt() {
  if (stats.mana < BOLT_COST && !creative) { toast('Not enough mana'); return; }
  if (!creative) stats.mana -= BOLT_COST;
  camera.getWorldDirection(_bd);
  const m = new THREE.Mesh(boltGeo, boltMat);
  m.position.set(player.position.x, player.position.y + EYE_OFFSET - 0.25, player.position.z).addScaledVector(_bd, 0.7);
  world.add(m);
  bolts.push({ mesh: m, vel: _bd.clone().multiplyScalar(30), life: 1.5 });
  useCd = 0.35;
}

function updateBolts(dt) {
  for (const b of [...bolts]) {
    b.life -= dt;
    const step = b.vel.length() * dt;
    _bd.copy(b.vel).normalize();
    let done = b.life <= 0 || !!raycastTerrain(b.mesh.position, _bd, 0, step);
    if (!done) {
      b.mesh.position.addScaledVector(b.vel, dt);
      const p = b.mesh.position;
      if (blocks.has(blockKey(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z)))) done = true;
      for (const a of animals) {
        if (Math.hypot(p.x - a.x, p.y - (a.y + a.sp.h * 0.55), p.z - a.z) < a.sp.r + 0.35) { hurtAnimal(a, 10, b.vel.x, b.vel.z); done = true; break; }
      }
      b.mesh.rotation.x += dt * 10; b.mesh.rotation.y += dt * 7;
    }
    if (done) { world.remove(b.mesh); bolts.splice(bolts.indexOf(b), 1); }
  }
}

const targetEl = document.getElementById('target');

function targetId(t) {
  if (!t) return null;

  if (t.kind === 'block') return t.key;

}

function updateInteraction(dt) {
  swingTime = Math.max(0, swingTime - dt);
  attackCd -= dt; useCd -= dt; warnCd -= dt;
  const active = (locked || testMode) && !inventoryOpen && gameState === 'playing';
  currentTarget = active ? pickTarget() : null;
  const t = currentTarget;
  // water between you and what you're aiming at (only from above the surface)
  aimWater = null;
  if (active && !cameraUnderwater) {
    camera.getWorldDirection(_aimD);
    _eye.set(player.position.x, player.position.y + EYE_OFFSET, player.position.z);
    const t0 = Math.max(0, _tv.subVectors(_eye, camera.position).dot(_aimD));
    aimWater = waterRay(camera.position, _aimD, t0, t ? Math.min(t.t, t0 + PLAYER.reach) : t0 + PLAYER.reach);
  }
  const held = slots[selectedSlot], def = held && ITEMS[held.id];

  // outline: where a held block would go, otherwise the block you're looking at
  const placeCell = def?.place ? placementCell(t) : null;
  if (placeCell && cellFree(placeCell)) {
    outline.position.set(placeCell[0] + 0.5, placeCell[1] + 0.5, placeCell[2] + 0.5);
    outline.material.color.set(0xffffff); outline.visible = true;
  } else if (t?.kind === 'block') {
    outline.position.set(t.cell[0] + 0.5, t.cell[1] + 0.5, t.cell[2] + 0.5);
    outline.material.color.set(0x000000); outline.visible = true;
  } else outline.visible = false;
  targetEl.textContent = aimWater ? (held?.id === 'bottle' ? 'Water: right click to fill the bottle' : 'Water: right click to drink') : t ? targetName(t) : '';

  if (active && mouse.left) {
    if (t?.kind === 'animal') {
      breakProgress = 0;
      if (attackCd <= 0) {
        attackCd = 0.45; swingTime = 0.25;
        hurtAnimal(t.animal, def?.damage ?? 2, t.animal.x - player.position.x, t.animal.z - player.position.z);
      }
    } else if (t) {
      const id = targetId(t);
      if (id !== breakKey) { breakKey = id; breakProgress = 0; }
      const time = breakTime(materialOf(t), def);
      if (!isFinite(time)) {
        if (warnCd <= 0) { const m = materialOf(t); toast(m === 'iron' ? 'Iron ore needs a stone or iron pickaxe' : `You need a pickaxe to break ${m === 'crystal' ? 'crystal' : 'stone'}`); warnCd = 2.5; }
        breakProgress = 0;
      } else {
        breakProgress += dt / time;
        if (breakProgress >= 1) { doBreak(t); breakProgress = 0; breakKey = null; }
      }
    } else { breakProgress = 0; breakKey = null; }
  } else { breakProgress = 0; breakKey = null; }

  if (active && mouse.right && useCd <= 0) { useCd = 0.25; swingTime = 0.2; useItem(t); }

  breakbarEl.style.display = breakProgress > 0 ? 'block' : 'none';
  breakFillEl.style.width = `${Math.min(1, breakProgress) * 100}%`;
}

// Weather: clear, cloudy, rain and thunderstorms come and go. Clouds grey the sky and dim the sun,
// rain falls around the camera (snow up in the mountains), fog thickens, the ground gets wet and
// dark, and storms flash and rumble. Rain stops where something is over your head (a cave, a roof).
// ---------------------------------------------------------------------------
const WEATHER = {
  clear:  { name: 'Clear', cloud: 0.1, rain: 0, storm: 0, chance: 0.4, wind: 0.2 },
  cloudy: { name: 'Cloudy', cloud: 0.6, rain: 0, storm: 0, chance: 0.27, wind: 0.45 },
  rain:   { name: 'Rain', cloud: 0.88, rain: 0.7, storm: 0, chance: 0.21, wind: 0.6 },
  storm:  { name: 'Thunderstorm', cloud: 1, rain: 1, storm: 1, chance: 0.12, wind: 1 },
};
const weather = { state: 'clear', timer: 200, cloud: 0.1, rain: 0, storm: 0, wind: 0.2, snow: 0, covered: 0, coverT: 0, flash: 0, nextBolt: 6, baked: 0.1 };
const skyClear = { zenith: sky.zenith.clone(), horizon: sky.horizon.clone(), sun: sky.sun.clone(), ground: sky.ground.clone() };
const skyStorm = { zenith: new THREE.Color(0x4a525c), horizon: new THREE.Color(0x7d858d), sun: new THREE.Color(0x9aa0a8), ground: new THREE.Color(0x2c2e2c) };
const cloudColors = { top: [new THREE.Color(0xffffff), new THREE.Color(0x8d939b)], under: [new THREE.Color(0xc4ccd6), new THREE.Color(0x5c636c)] };
const flashEl = document.getElementById('flash');

function setWeather(state, quick = false) {
  weather.state = state;
  weather.timer = 120 + Math.random() * 180;
  if (quick) Object.assign(weather, { cloud: WEATHER[state].cloud, rain: WEATHER[state].rain, storm: WEATHER[state].storm });
}
function nextWeather() {
  let r = Math.random() * 0.999, pick = 'clear';
  const options = Object.keys(WEATHER).filter((k) => k !== weather.state);
  const total = options.reduce((a, k) => a + WEATHER[k].chance, 0);
  for (const k of options) { r -= WEATHER[k].chance / total; if (r < 0) { pick = k; break; } }
  setWeather(pick);
}

// Rain: streaks that fall through a box around the camera. Each drop keeps its place in the world
// (the box just wraps around you), so walking doesn't drag the rain along.
const RAIN_DROPS = QUALITY === 'low' ? 3500 : 9000, SNOW_FLAKES = QUALITY === 'low' ? 2500 : 6000;
const precipUniforms = { uTime: { value: 0 }, uCam: { value: new THREE.Vector3() }, uWindXZ: { value: new THREE.Vector2(2, 1) }, uAlpha: { value: 0 } };
function makePrecipitation(count, snow) {
  const rand = mulberry32(snow ? 77 : 33);
  const verts = snow ? 1 : 2, pos = new Float32Array(count * verts * 3), end = new Float32Array(count * verts);
  for (let i = 0; i < count; i++) {
    const x = rand(), y = rand(), z = rand();
    for (let v = 0; v < verts; v++) { pos.set([x, y, z], (i * verts + v) * 3); end[i * verts + v] = v; }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aEnd', new THREE.BufferAttribute(end, 1));
  const box = snow ? [50, 30, 50] : [56, 34, 56], speed = snow ? 1.6 : 22, len = 0.6;
  const mat = new THREE.ShaderMaterial({
    uniforms: { ...precipUniforms, uAlpha: { value: 0 } },
    transparent: true, depthWrite: false, fog: false,
    vertexShader: `
      uniform float uTime; uniform vec3 uCam; uniform vec2 uWindXZ;
      attribute float aEnd;
      varying float vFade;
      void main() {
        vec3 box = vec3(${box.map((b) => b.toFixed(1)).join(', ')});
        vec3 vel = vec3(uWindXZ.x, -${speed.toFixed(1)}, uWindXZ.y);
        vec3 p = position * box + vel * uTime;
        ${snow ? 'p.x += sin(uTime * 0.9 + position.y * 40.0) * 0.6; p.z += cos(uTime * 0.7 + position.x * 40.0) * 0.6;' : ''}
        vec3 lo = uCam - box * 0.5;
        p = lo + mod(p - lo, box);
        ${snow ? '' : `p -= normalize(vel) * ${len.toFixed(2)} * aEnd; // the streak's tail`}
        float d = length(p - uCam);
        vFade = (1.0 - smoothstep(box.x * 0.3, box.x * 0.5, d)) * smoothstep(0.5, 2.0, d);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        ${snow ? 'gl_PointSize = clamp(90.0 / -mv.z, 1.0, 9.0);' : ''}
      }`,
    fragmentShader: `
      uniform float uAlpha;
      varying float vFade;
      void main() {
        ${snow ? 'vec2 c = gl_PointCoord - 0.5; float a = smoothstep(0.5, 0.2, length(c));' : 'float a = 1.0;'}
        gl_FragColor = vec4(${snow ? 'vec3(1.0)' : 'vec3(0.72, 0.76, 0.82)'}, a * vFade * uAlpha);
      }`,
  });
  const obj = snow ? new THREE.Points(geo, mat) : new THREE.LineSegments(geo, mat);
  obj.frustumCulled = false;
  obj.renderOrder = 2;
  obj.userData.count = count; obj.userData.verts = verts;
  return obj;
}
const rainFx = makePrecipitation(RAIN_DROPS, false), snowFx = makePrecipitation(SNOW_FLAKES, true);
scene.add(rainFx, snowFx);

// Sound: rain is looping filtered noise, thunder a low noise burst. Made with Web Audio, no files.
const sound = { ctx: null, rain: null, noise: null, on: true };
function initSound() {
  if (sound.ctx || !sound.on) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC(), n = ctx.sampleRate * 3, buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < n; i++) { // pink-ish noise
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.099046; b1 = 0.963 * b1 + w * 0.2965164; b2 = 0.57 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.17;
  }
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
  const gain = ctx.createGain(); gain.gain.value = 0;
  src.connect(hp).connect(gain).connect(ctx.destination);
  src.start();
  Object.assign(sound, { ctx, rain: gain, noise: buf });
}
function setSound(on) {
  sound.on = on;
  if (on) initSound();
  if (sound.ctx) on ? sound.ctx.resume() : sound.ctx.suspend();
}
function thunder(delay, strength) {
  const ctx = sound.ctx;
  if (!ctx || !sound.on) return;
  const t = ctx.currentTime + delay;
  const src = ctx.createBufferSource(); src.buffer = sound.noise; src.playbackRate.value = 0.3;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180 + strength * 120;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.6 * strength, t + 0.06 + delay * 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2.5 + strength * 2);
  src.connect(lp).connect(g).connect(ctx.destination);
  src.start(t, Math.random() * 2); src.stop(t + 5);
}

const _up = new THREE.Vector3(0, 1, 0);
function updateWeather(dt) {
  weather.timer -= dt;
  if (weather.timer <= 0) nextWeather();
  const tgt = WEATHER[weather.state], k = 1 - Math.exp(-dt / 10);
  for (const key of ['cloud', 'rain', 'storm', 'wind']) weather[key] += (tgt[key] - weather[key]) * k;
  const c = smoothstep(0.15, 1, weather.cloud), cam = camera.position;

  // sky, sun and fog
  for (const key of ['zenith', 'horizon', 'sun', 'ground']) sky[key].copy(skyClear[key]).lerp(skyStorm[key], c * 0.9);
  if (weather.flash > 0) sky.horizon.lerp(new THREE.Color(0xd8e0f0), weather.flash * 0.5);
  skyDome.material.uniforms.uSunGlow.value = 1 - c * 0.85;
  for (const l of csm.lights) l.intensity = 3.4 * (1 - 0.7 * c);
  if (!cameraUnderwater) {
    scene.fog.color.copy(skyColor);
    scene.fog.density = FOG_DENSITY * (1 + c * 0.6 + weather.rain * 1.4);
  }
  if (Math.abs(c - weather.baked) > 0.04) { weather.baked = c; bakeSkyLight(); }
  if (cloudMats.top) {
    cloudMats.top.color.copy(cloudColors.top[0]).lerp(cloudColors.top[1], c);
    cloudMats.under.color.copy(cloudColors.under[0]).lerp(cloudColors.under[1], c);
    const n = clouds.children.length, show = Math.round(n * (0.3 + 0.7 * weather.cloud));
    clouds.children.forEach((g, i) => { g.visible = i < show; });
  }

  // is something over the camera's head? (checked a few times a second)
  weather.coverT -= dt;
  if (weather.coverT <= 0) {
    weather.coverT = 0.25;
    const above = !!raycastTerrain(cam, _up, 0, 60) || !!voxelRay(cam, _up, 0, 24);
    weather.coveredTarget = above || cameraUnderwater ? 1 : 0;
  }
  weather.covered += ((weather.coveredTarget || 0) - weather.covered) * Math.min(1, dt * 4);
  weather.snow = smoothstep(58, 74, cam.y);
  const open = 1 - weather.covered;
  precipUniforms.uTime.value = gameTime;
  precipUniforms.uCam.value.copy(cam);
  precipUniforms.uWindXZ.value.set(1 + weather.wind * 5, 0.5 + weather.wind * 2);
  rainFx.material.uniforms.uAlpha.value = 0.38 * open * (1 - weather.snow);
  snowFx.material.uniforms.uAlpha.value = 0.9 * open * weather.snow;
  rainFx.geometry.setDrawRange(0, Math.floor(rainFx.userData.count * weather.rain) * 2);
  snowFx.geometry.setDrawRange(0, Math.floor(snowFx.userData.count * weather.rain));
  rainFx.visible = weather.rain > 0.01 && weather.snow < 0.99;
  snowFx.visible = weather.rain > 0.01 && weather.snow > 0.01;
  terrainUniforms.uRainWet.value += ((weather.rain > 0.2 ? 1 : 0) - terrainUniforms.uRainWet.value) * Math.min(1, dt / (weather.rain > 0.2 ? 25 : 60));
  grassUniforms.uWind.value = weather.wind;

  // lightning
  if (weather.storm > 0.6) {
    weather.nextBolt -= dt;
    if (weather.nextBolt <= 0) {
      weather.nextBolt = 4 + Math.random() * 12;
      weather.flash = 1;
      const dist = Math.random();
      thunder(0.3 + dist * 2.5, 1 - dist * 0.6);
    }
  }
  weather.flash = Math.max(0, weather.flash - dt * 4);
  const flicker = weather.flash > 0 ? weather.flash * (0.6 + 0.4 * Math.sin(gameTime * 60)) : 0;
  flashLight.intensity = flicker * 5 * open;
  flashEl.style.opacity = (flicker * 0.35 * open).toFixed(3);

  if (sound.rain) sound.rain.gain.setTargetAtTime(sound.on ? weather.rain * (1 - weather.snow) * (0.12 + 0.18 * open) : 0, sound.ctx.currentTime, 0.4);
}

  if (e.button === 2) mouse.right = false;
});
document.addEventListener('contextmenu', (e) => { if (locked) e.preventDefault(); });
window.addEventListener('wheel', (e) => {
  if (!locked || inventoryOpen) return;
  selectSlot(selectedSlot + Math.sign(e.deltaY));
}, { passive: true });
window.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
  if (gameState !== 'playing') return;
  if (e.code === 'Tab') e.preventDefault();
  if (e.code === 'KeyE' || e.code === 'KeyI' || e.code === 'Tab') { if (!e.repeat) setInventoryOpen(!inventoryOpen); return; }
  if (inventoryOpen) { if (e.code === 'Escape') setInventoryOpen(false); return; }
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  if (e.code.startsWith('Digit') && e.code !== 'Digit0') selectSlot(+e.code.slice(5) - 1);
  if (e.code === 'KeyV' || e.code === 'KeyC') {
    thirdPerson = !thirdPerson;
    if (!thirdPerson) yaw = player.facing;
    clampPitch();
  }
  if (e.code === 'KeyG') setCreative(!creative);
  if (e.code === 'KeyZ') camDistIndex = (camDistIndex + 1) % CAM_DISTANCES.length;
  if (e.code === 'KeyF') { lanternOn = !lanternOn; lantern.visible = lanternOn; }
  if (e.code === 'KeyR') respawn();
  if (e.code === 'KeyB') {
    buildShape = SHAPES[(SHAPES.indexOf(buildShape) + 1) % SHAPES.length];
    toast(`Building shape: ${SHAPE_NAMES[buildShape]} (B to change)`);
  }
  if (e.code === 'KeyK') { nextWeather(); toast(`Weather: ${WEATHER[weather.state].name}`); }
  if (e.code === 'KeyM') { setSound(!sound.on); $('sound-select').value = sound.on ? 'on' : 'off'; toast(sound.on ? 'Sound on' : 'Sound off'); }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.left = mouse.right = false; });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  csm.updateFrustums();
});

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let worldStats = null, generating = false;
// Generating takes a few seconds and blocks the page, so show the message first and start a frame later.
function newWorld(seed) {
  generating = true;
  updateOverlay();
  setTimeout(() => {
    worldStats = generateWorld(seed);
    spawnFacing = findSpawn();
    player.facing = yaw = spawnFacing;
    respawn();
    setWeather('clear', true);
    const url = new URL(location.href);
    url.searchParams.set('seed', seed);
    history.replaceState(null, '', url);
    $('seed-input').value = seed;
    generating = false;
    updateOverlay();
  }, 40);
}

// Title screen: the camera slowly circles the starting point, high enough to clear the hills.
let menuCamY = null;
function updateMenuCamera(dt) {
  const c = player.spawn, a = gameTime * 0.035, r = 75;
  const x = THREE.MathUtils.clamp(c.x + Math.cos(a) * r, 5, WORLD.size - 5), z = THREE.MathUtils.clamp(c.z + Math.sin(a) * r, 5, WORLD.size - 5);
  let ground = 0;
  for (let k = 0; k <= 4; k++) ground = Math.max(ground, terrainFns.surfaceHeight(lerp(x, c.x, k / 6), lerp(z, c.z, k / 6)));
  const want = Math.max(c.y + 28, ground + 16);
  menuCamY = menuCamY === null ? want : menuCamY + (want - menuCamY) * Math.min(1, dt * 0.8);
  camera.position.set(x, menuCamY, z);
  camera.lookAt(c.x, c.y + 4, c.z);
}

const initialSeed = Number(urlParams.get('seed')) || Math.floor(Math.random() * 1e6);


const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0, fps = 0, litCheck = 0;
// Skips what's too far away to see through the fog: terrain chunks, vegetation tiles (simpler
// shapes in the middle distance) and animals.
function updateCulling() {
  const cx = camera.position.x, cz = camera.position.z, w = chunkWidth();
  const away = (x, z, half) => Math.hypot(Math.max(0, Math.abs(cx - x) - half), Math.max(0, Math.abs(cz - z) - half));
  for (const ch of chunks) if (ch.render) ch.render.visible = away((ch.i + 0.5) * w, (ch.j + 0.5) * w, w / 2) < VIEW_DIST;
  for (const t of vegTiles) {
    const d = away(t.cx, t.cz, VEG_TILE / 2);
    t.near.visible = d < VEG_NEAR;
    t.far.visible = d >= VEG_NEAR && d < VEG_FAR;
  }
  for (const a of animals) a.group.visible = Math.hypot(a.x - cx, a.z - cz) < 220;
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (generating || !worldStats) return;
  // paused: in a game with the menu showing (not in the inventory, which keeps the world going)
  const paused = gameState === 'playing' && !locked && !inventoryOpen && !testMode;
  if (paused) { renderer.render(scene, camera); return; }
  gameTime += dt;
  if (gameState === 'playing') {
    updatePlayer(dt);
    updateCamera(dt);
    updateInteraction(dt);
    updateStats(dt);
    renderStats();
  } else {
    updateMenuCamera(dt);
  }
  updateAnimals(dt);
  updateBolts(dt);
  updateUnderwater();
  updateWeather(dt);
  viewModel.update(dt);
  updateGrass(camera.position.x, camera.position.z, gameState === 'playing' ? 2 : 1);
  updateCampfires(gameTime);
  updateVolcanoes(dt, gameTime);
  terrainUniforms.uTime.value = gameTime;
  waterUniforms.uTime.value = gameTime;
  crosshair.style.display = (locked || testMode) && !inventoryOpen ? 'block' : 'none';
  if (clouds) clouds.position.x = (clouds.position.x + dt * 1.2) % (WORLD.size * 0.5);

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc > 0.5) { fps = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }
  const feet = player.position.y - FOOT_OFFSET;
  const underground = feet < terrainFns.surfaceHeight(player.position.x, player.position.z) - 4;
  const state = creative ? 'flying' : player.inLava ? 'IN LAVA' : player.onGround ? 'grounded' : contact.steep ? 'sliding' : player.inWater ? 'in water' : 'airborne';
  hud.textContent =
    `${thirdPerson ? 'Third person' : 'First person'}  ·  ${creative ? 'Creative' : 'Survival'}  ·  ${fps} fps  ·  seed ${worldStats.seed}  ·  map ${WORLD.size} m  ·  ${WEATHER[weather.state].name}\n` +
    `pos ${player.position.x.toFixed(1)}, ${feet.toFixed(1)}, ${player.position.z.toFixed(1)}  ·  ${state}${underground ? '  ·  in a cave' : ''}` +
    `${stats.armour ? `  ·  armour ${Math.round(stats.armour * 100)}%` : ''}  ·  ${animals.length} animals`;

  if (++litCheck % 30 === 0) prepareLighting(scene); // new animals, blocks, campfires
  if (litCheck % 8 === 0) updateCulling();
  skyDome.position.copy(camera.position);
  camera.updateMatrixWorld();
  csm.update();
  renderer.render(scene, camera);
}

// let the loading text paint before the (synchronous) generation runs
requestAnimationFrame(() => setTimeout(() => {
  newWorld(initialSeed);
  // Public hooks, for adding items later and for testing
  window.game = { registerItem, addItem, removeItem, countItem, getSelectedItem, slots, ITEMS, WORLD, PLAYER };
  window.__game = {
    player, keys, contact, worldStats: () => worldStats, terrain: () => terrainFns, groundAt,
    setView: (tp) => { thirdPerson = tp; clampPitch(); }, setLook: (y, p) => { yaw = y; pitch = p; clampPitch(); },
    setInventoryOpen, selectSlot, setCamDistance: (i) => { camDistIndex = i; },
    mouse, stats, animals, blocks, chunks: () => chunks, editTerrain, pickTarget, doBreak, useItem, placeBlock, craft, RECIPES,
    setCreative, isCreative: () => creative, setTestMode: (on) => { testMode = on; }, target: () => currentTarget,
    spawnAnimal: (kind, x, z) => { const g = groundAt(x, z); return g && spawnAnimal(kind, x, g.point.y, z, Math.random); },
    underwater: () => cameraUnderwater, time: () => gameTime, damagePlayer, targets: () => [...targetGrid.values()].flat(),
    renderer, scene, camera, csm, texInfo, QUALITY,
    startGame, toMainMenu, state: () => gameState, ready: () => !!worldStats && !generating, weather, setWeather, WEATHER,
    aimWater: () => aimWater, useWater, grassPatches, MAX_HEALTH, updateGrass,
    lavaFlows, lavaAt, burning: () => burning, setShape: (sh) => { buildShape = sh; }, blockGroups, character, breakTime,
  };
  frame();
}, 30));
</script>
</body>
</html>
