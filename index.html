let terrainFns = null;
let clouds = null;
const volcanoFx = [];     // { v, lava, light, smoke[] }

// Obstacles (tree trunks, boulders) in a spatial hash for fast collision
const CELL = 8;
const obstacleGrid = new Map();
const cellKey = (cx, cz) => cx * 73856093 ^ cz * 19349663;
function addObstacle(o) {
  const k = cellKey(Math.floor(o.x / CELL), Math.floor(o.z / CELL));
  if (!obstacleGrid.has(k)) obstacleGrid.set(k, []);
  obstacleGrid.get(k).push(o);
}

function gridRemove(grid, o) {
  const list = grid.get(cellKey(Math.floor(o.x / CELL), Math.floor(o.z / CELL)));
  const i = list ? list.indexOf(o) : -1;
  if (i >= 0) list.splice(i, 1);
}
// Things you can break or harvest (trees, bushes, boulders), in the same kind of spatial hash
const targetGrid = new Map();
function addTarget(t) {
  const k = cellKey(Math.floor(t.x / CELL), Math.floor(t.z / CELL));
  if (!targetGrid.has(k)) targetGrid.set(k, []);
  targetGrid.get(k).push(t);
}

function disposeWorld() {
  world.traverse((o) => {
    if (o.geometry) { o.geometry.disposeBoundsTree?.(); o.geometry.dispose(); }
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { forgetMaterial(m); m.dispose(); });
  });
  for (const c of chunks) c.collider?.geometry.disposeBoundsTree();
  for (const c of chunks) c.collider?.geometry.dispose();
  chunks = []; colliders.length = 0; editedMat.clear();
  world.clear();
  obstacleGrid.clear(); targetGrid.clear();
  volcanoFx.length = 0;
  vegTiles.length = 0;
  animals.length = 0; bolts.length = 0;
  resetBlocks();
  clearGrass();
}

const chunkWidth = () => CHUNK * WORLD.voxel;

// (Re)builds the collider + render mesh of one chunk from the current density field.
function buildChunk(i, j) {
  const { field, nx, ny, nz } = terrainField;
  const ch = chunks[i + chunkCount * j];
  if (ch.render) { world.remove(ch.render); ch.render.geometry.dispose(); ch.render = null; }
  if (ch.collider) {
    ch.collider.geometry.disposeBoundsTree(); ch.collider.geometry.dispose();
    colliders.splice(colliders.indexOf(ch.collider), 1); ch.collider = null;
  }
  const geo = surfaceNets(field, nx, ny, nz, WORLD.voxel, i * CHUNK, (i + 1) * CHUNK, j * CHUNK, (j + 1) * CHUNK);
  if (!geo.index.count) { geo.dispose(); return 0; }
  geo.computeBoundsTree();
  ch.collider = new THREE.Mesh(geo);
  ch.collider.userData.chunk = ch;
  colliders.push(ch.collider);
  ch.render = new THREE.Mesh(buildRenderGeometry(geo, terrainFns), terrainMaterial);
  ch.render.castShadow = true;
  ch.render.receiveShadow = true;
  world.add(ch.render);
  return geo.index.count / 3;
}

// The collider meshes whose triangles could lie between x0..x1, z0..z1.
const _near = [];
function chunksIn(x0, x1, z0, z1) {
  const w = chunkWidth(), vx = WORLD.voxel;
  const i0 = Math.max(0, Math.floor((x0 - 0.01) / w)), i1 = Math.min(chunkCount - 1, Math.floor((x1 + vx) / w));
  const j0 = Math.max(0, Math.floor((z0 - 0.01) / w)), j1 = Math.min(chunkCount - 1, Math.floor((z1 + vx) / w));
  _near.length = 0;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const c = chunks[i + chunkCount * j].collider;
    if (c) _near.push(c);
  }
  return _near;
}

function generateWorld(seed) {
  disposeWorld();
  const t0 = performance.now();
  terrainFns = createTerrainFunctions(seed);
  terrainField = buildDensityField(terrainFns);
  terrainMaterial = makeTerrainMaterial();
  chunkCount = Math.ceil((terrainField.nx - 1) / CHUNK);
  chunks = [];
  for (let j = 0; j < chunkCount; j++) for (let i = 0; i < chunkCount; i++) chunks.push({ i, j, collider: null, render: null });
  let triangles = 0;
  for (let j = 0; j < chunkCount; j++) for (let i = 0; i < chunkCount; i++) triangles += buildChunk(i, j);

  terrainUniforms.uVolc.value.forEach((u) => u.set(-1e4, -1e4, 1, 0));
  terrainFns.volcanoes.slice(0, 4).forEach((v, i) => terrainUniforms.uVolc.value[i].set(v.x, v.z, v.crater, v.lavaY));

  world.add(makeWater());
  addVolcanoEffects();
  const counts = placeVegetation(seed);
  addClouds(seed);
  initBlocks();
  const animalCount = spawnAnimals(seed);
  prepareLighting(scene);

  const stats = { seed, ms: Math.round(performance.now() - t0), triangles, chunks: chunks.length, ...counts, animals: animalCount };
  console.log('World generated', stats);
  return stats;
}

// Water: a smooth surface whose small waves and ripples are drawn per pixel. It reflects the sky,
// is clearer when you look straight down (Fresnel), and turns shallow turquoise with foam near the
// shore. The shore depth comes from a small height texture of the ground under the lake.
const waterUniforms = { uTime: { value: 0 }, uGroundH: { value: null }, uWorld: { value: new THREE.Vector3() } };
function makeWaterDepthTexture() {
  const n = Math.round(WORLD.size / 2) + 1, data = new Uint8Array(n * n), T = terrainFns;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const h = T.surfaceHeight((i / (n - 1)) * WORLD.size, (j / (n - 1)) * WORLD.size);
    data[i + j * n] = Math.max(0, Math.min(255, Math.round((h / WORLD.height) * 255)));
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RedFormat, THREE.UnsignedByteType);
  t.magFilter = t.minFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}
function makeWater() {
  const S = WORLD.size - 2;
  const geo = new THREE.PlaneGeometry(S, S, Math.round(S / 4), Math.round(S / 4));
  waterUniforms.uGroundH.value?.dispose();
  waterUniforms.uGroundH.value = makeWaterDepthTexture();
  waterUniforms.uWorld.value.set(WORLD.size, WORLD.height, WORLD.waterLevel);
  const mat = new THREE.MeshStandardMaterial({ color: 0x06303f, roughness: 0.06, metalness: 0, transparent: true, opacity: 0.85, side: THREE.DoubleSide, envMapIntensity: 0.75 });
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, waterUniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        // the plane is rotated to lie flat, so local z is world up: a gentle swell
        transformed.z += (sin(position.x * 0.11 + uTime * 0.7) + sin(position.y * 0.09 - uTime * 0.55)) * 0.05;`)
      .replace('#include <project_vertex>', `#include <project_vertex>
        vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uTime;
        uniform sampler2D uGroundH;
        uniform vec3 uWorld; // size, height, water level
        varying vec3 vWPos;
        float wh(vec2 p) { p = fract(p * 0.3183099 + 0.1) * 17.0; return fract(p.x * p.y * (p.x + p.y)); }
        float wnoise(vec2 x) {
          vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(wh(i), wh(i + vec2(1, 0)), f.x), mix(wh(i + vec2(0, 1)), wh(i + vec2(1, 1)), f.x), f.y);
        }
        vec2 wgrad(vec2 p) { const float e = 0.08; return vec2(wnoise(p + vec2(e, 0)) - wnoise(p - vec2(e, 0)), wnoise(p + vec2(0, e)) - wnoise(p - vec2(0, e))) / (2.0 * e); }
        vec2 wave(vec2 p, vec2 d, float k, float w, float a) { return d * (a * k * cos(dot(d, p) * k + uTime * w)); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float groundH = texture2D(uGroundH, vWPos.xz / uWorld.x).r * uWorld.y;
        float depth = vWPos.y - groundH; // the surface is at the water level (sea or lake)
        float shallow = 1.0 - smoothstep(0.2, 3.5, depth);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.05, 0.2, 0.19), shallow * 0.7);
        float foam = (1.0 - smoothstep(0.0, 0.3, depth + (wnoise(vWPos.xz * 1.7 + uTime * 0.4) - 0.5) * 0.3)) * step(-0.4, depth) * 0.7;
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.85, 0.9, 0.92), foam * 0.75);`)
      .replace('#include <normal_fragment_maps>', `
        vec2 p = vWPos.xz, g = vec2(0.0);
        g += wave(p, normalize(vec2(0.8, 0.6)), 0.55, 1.2, 0.05);
        g += wave(p, normalize(vec2(-0.4, 0.9)), 0.9, 1.7, 0.03);
        g += wave(p, normalize(vec2(0.95, -0.3)), 1.6, 2.3, 0.015);
        g += wgrad(p * 1.1 + vec2(uTime * 0.25, uTime * 0.18)) * 0.05;
        g += wgrad(p * 3.3 - vec2(uTime * 0.35, -uTime * 0.22)) * 0.022;
        g *= 1.0 - foam * 0.7;
        vec3 nW = normalize(vec3(-g.x, 1.0, -g.y));
        normal = normalize((viewMatrix * vec4(nW, 0.0)).xyz) * faceDirection;
        // clearer straight down, mirror-like at grazing angles; see-through in the shallows
        float fres = pow(1.0 - clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0), 4.0);
        diffuseColor.a = mix(mix(0.8, 0.97, fres), 0.3, shallow * (1.0 - fres)) + foam * 0.5;
        diffuseColor.a = clamp(diffuseColor.a, 0.0, 1.0);`);
  };
  const water = new THREE.Mesh(geo, mat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(WORLD.size / 2, WORLD.waterLevel, WORLD.size / 2);
  water.receiveShadow = false; // shadows on a moving mirror look wrong, and cost a lookup
  water.renderOrder = 1;
  const group = new THREE.Group();
  group.add(water);
  // lakes: a flat fan following each lake's wobbly outline, out to where the shore is above the water
  for (const lk of terrainFns.lakes) {
    const n = 72, pos = [0, 0, 0], idx = [];
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2, r = terrainFns.lakeRadius(lk, a) * terrainFns.LAKE_EDGE;
      pos.push(Math.cos(a) * r, -Math.sin(a) * r, 0); // the plane is turned flat, so local -y is world +z
      idx.push(0, 1 + k, 1 + ((k + 1) % n));
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(lk.x, lk.level, lk.z);
    m.renderOrder = 1;
    group.add(m);
  }
  return group;
}

const raycaster = new THREE.Raycaster();
raycaster.firstHitOnly = true;
const DOWN = new THREE.Vector3(0, -1, 0);
const _rayO = new THREE.Vector3();

function groundAt(x, z, fromY = WORLD.height + 5) {
  raycaster.set(_rayO.set(x, fromY, z), DOWN);
  raycaster.near = 0;
  raycaster.far = fromY + 10;
  return raycaster.intersectObjects(chunksIn(x, x, z, z), false)[0] || null;
}

// First terrain hit along a ray, or null.
function raycastTerrain(origin, dir, near, far) {
  raycaster.set(origin, dir);
  raycaster.near = near; raycaster.far = far;
  const hit = raycaster.intersectObjects(colliders, false)[0] || null;
  raycaster.near = 0;
  return hit;
}

// ---------------------------------------------------------------------------
// Terrain editing: dig (carve a sphere out of the density field) or add ground (fill one in),
// then rebuild only the chunks that changed.
// ---------------------------------------------------------------------------
const gridIndexAt = (x, y, z) => {
  const { nx, ny, nz } = terrainField, vx = WORLD.voxel;
  const ix = Math.round(x / vx), iy = Math.round(y / vx), iz = Math.round(z / vx);
  if (ix < 0 || iy < 0 || iz < 0 || ix >= nx || iy >= ny || iz >= nz) return -1;
  return ix + nx * (iy + ny * iz);
};
function editedMaterialAt(x, y, z) {
  if (!editedMat.size) return null;
  return editedMat.get(gridIndexAt(x, y, z)) || null;
}

// What the natural ground is made of at a point (used for drops and to colour dug ground).
function naturalMaterial(x, y, z, ny = 1) {
  const T = terrainFns;
  if (T.volcanoInfluence(x, z) > 0.3) return 'stone';
  const surf = T.surfaceHeight(x, z);
  if (y < surf - 3.5 || y > 72 || ny < 0.5) return T.oreAt(x, y, z) > 0.5 ? 'iron' : 'stone';
  return y < T.waterAt(x, z) + 1.8 ? 'sand' : 'dirt';
}

// Returns how many grid points flipped between ground and air.
function editTerrain(center, radius, add, material = 'dirt') {
  const { field, nx, ny, nz } = terrainField, vx = WORLD.voxel;
  const lo = (v, n) => Math.max(1, Math.ceil((v - radius - 2) / vx)), hi = (v, n) => Math.min(n - 2, Math.floor((v + radius + 2) / vx));
  let flipped = 0, minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (let iz = lo(center.z, nz); iz <= hi(center.z, nz); iz++)
  for (let iy = Math.max(add ? 1 : 3, lo(center.y, ny)); iy <= hi(center.y, ny); iy++)
  for (let ix = lo(center.x, nx); ix <= hi(center.x, nx); ix++) {
    const x = ix * vx, y = iy * vx, z = iz * vx;
    const d = Math.hypot(x - center.x, y - center.y, z - center.z);
    const idx = ix + nx * (iy + ny * iz);
    const before = field[idx];
    if (add) {
      if (d > radius) continue;
      field[idx] = Math.max(before, radius - d);
      if (before <= 0 && field[idx] > 0) { flipped++; editedMat.set(idx, material); }
    } else {
      if (d <= radius) {
        field[idx] = Math.min(before, d - radius);
        if (before > 0 && field[idx] <= 0) flipped++;
      }
      // remember what the newly exposed ground around the hole is made of
      if (d <= radius + vx * 1.2 && field[idx] > 0 && !editedMat.has(idx)) editedMat.set(idx, naturalMaterial(x, y, z));
    }
    minX = Math.min(minX, ix); maxX = Math.max(maxX, ix); minZ = Math.min(minZ, iz); maxZ = Math.max(maxZ, iz);
  }
  if (minX === Infinity) return 0;
  invalidateGrass(minX * vx, maxX * vx, minZ * vx, maxZ * vx);
  // a changed grid point affects the faces owned by its neighbours too
  const i0 = Math.max(0, Math.floor((minX - 1) / CHUNK)), i1 = Math.min(chunkCount - 1, Math.floor((maxX + 1) / CHUNK));
  const j0 = Math.max(0, Math.floor((minZ - 1) / CHUNK)), j1 = Math.min(chunkCount - 1, Math.floor((maxZ + 1) / CHUNK));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) buildChunk(i, j);
  return flipped;
}

function addVolcanoEffects() {
  lavaFlows.length = 0;
  const rand = mulberry32(Math.round(terrainFns.volcanoes[0]?.x * 1000 || 1));
  for (const v of terrainFns.volcanoes) {
    addLavaFlows(v, rand);
    const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff5a1a });
    const lava = new THREE.Mesh(new THREE.CircleGeometry(v.crater * 0.75, 10), lavaMat);
    lava.rotation.x = -Math.PI / 2;
    lava.position.set(v.x, v.lavaY, v.z);
    world.add(lava);
    const light = new THREE.PointLight(0xff6a2a, 260, 45, 1.5);
    light.position.set(v.x, v.lavaY + 6, v.z);
    world.add(light);
    const smoke = [];
    for (let i = 0; i < 26; i++) {
      const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTexture(), color: 0x6f6864, transparent: true, opacity: 0.5, depthWrite: false }));
      m.userData = { t: i / 26, ox: (Math.random() - 0.5) * v.crater, oz: (Math.random() - 0.5) * v.crater, spin: Math.random() * 2 };
      world.add(m);
      smoke.push(m);
    }
    volcanoFx.push({ v, lava, lavaMat, light, smoke });
  }
}

// Lava flows: glowing rivers running from each crater rim down the volcano's side. Each follows the
// slope downhill (with a little wander) until the ground flattens out at the foot of the cone.
const lavaFlows = [];   // { pts: [{x, y, z, w}], minX, maxX, minZ, maxZ }
const lavaUniforms = { uTime: { value: 0 } };
function lavaFlowMaterial() {
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, lavaUniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vLavaUv;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLavaUv = uv;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uTime;
        varying vec2 vLavaUv;
        float lh(vec2 p) { p = fract(p * vec2(0.3183, 0.3679) + 0.1) * 17.0; return fract(p.x * p.y * (p.x + p.y)); }
        float ln(vec2 x) { vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(lh(i), lh(i + vec2(1, 0)), f.x), mix(lh(i + vec2(0, 1)), lh(i + vec2(1, 1)), f.x), f.y); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        // u runs across the flow (0..1), v along it in metres; the pattern slides downhill
        float along = vLavaUv.y * 0.35 - uTime * 0.5;
        float n = ln(vec2(vLavaUv.x * 4.0, along)) * 0.6 + ln(vec2(vLavaUv.x * 11.0, along * 2.7)) * 0.4;
        float middle = 1.0 - abs(vLavaUv.x - 0.5) * 2.0;
        float hot = smoothstep(0.35, 0.75, n * 0.6 + middle * 0.7);
        vec3 crust = vec3(0.09, 0.035, 0.02), glow = vec3(1.6, 0.55, 0.1), white = vec3(2.2, 1.4, 0.5);
        diffuseColor.rgb = mix(crust, mix(glow, white, smoothstep(0.85, 1.0, hot)), hot);`);
  };
  return mat;
}

function addLavaFlows(v, rand) {
  const T = terrainFns, mat = lavaFlowMaterial();
  const n = 3 + Math.floor(rand() * 2);
  for (let f = 0; f < n; f++) {
    const a0 = (f / n) * Math.PI * 2 + rand() * 1.2;
    let x = v.x + Math.cos(a0) * v.crater * 1.05, z = v.z + Math.sin(a0) * v.crater * 1.05;
    let dx = Math.cos(a0), dz = Math.sin(a0);
    const pts = [];
    for (let k = 0; k < 120; k++) {
      // downhill direction from the height field, blended with the current heading so it bends smoothly
      const e = 1.5, gx = T.surfaceHeight(x + e, z) - T.surfaceHeight(x - e, z), gz = T.surfaceHeight(x, z + e) - T.surfaceHeight(x, z - e);
      const g = Math.hypot(gx, gz);
      if (k > 6 && (g < 0.12 || T.volcanoInfluence(x, z) < 0.3)) break;
      const wander = T.noise2(x * 0.05 + f * 9, z * 0.05) * 0.5;
      dx = dx * 0.6 - (gx / (g || 1)) * 0.4 + -dz * wander * 0.3; dz = dz * 0.6 - (gz / (g || 1)) * 0.4 + dx * wander * 0.3;
      const dl = Math.hypot(dx, dz) || 1; dx /= dl; dz /= dl;
      const w = (1.6 + rand() * 0.4) * (1 - k / 160);
      pts.push({ x, z, w, dx, dz });
      x += dx * 1.6; z += dz * 1.6;
    }
    if (pts.length < 8) continue;
    // a strip of three vertices across the flow at each point, each draped on the ground
    const pos = [], uv = [], idx = [];
    let along = 0;
    pts.forEach((p, k) => {
      if (k) along += Math.hypot(p.x - pts[k - 1].x, p.z - pts[k - 1].z);
      const px = -p.dz, pz = p.dx;
      for (let c = 0; c < 3; c++) {
        const off = (c - 1) * p.w, cx = p.x + px * off, cz = p.z + pz * off;
        const hit = groundAt(cx, cz);
        const y = (hit ? hit.point.y : T.surfaceHeight(cx, cz)) + 0.12;
        pos.push(cx, y, cz); uv.push(c / 2, along);
        if (c === 1) p.y = y;
      }
      if (k) for (let c = 0; c < 2; c++) { const a = (k - 1) * 3 + c, b = k * 3 + c; idx.push(a, b, a + 1, a + 1, b, b + 1); }
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    geo.computeBoundingSphere();
    const mesh = new THREE.Mesh(geo, mat);
    world.add(mesh);
    const xs = pts.map((p) => p.x), zs = pts.map((p) => p.z);
    lavaFlows.push({ pts, minX: Math.min(...xs) - 3, maxX: Math.max(...xs) + 3, minZ: Math.min(...zs) - 3, maxZ: Math.max(...zs) + 3 });
  }
}

// Height of the lava lake in a crater at (x, z), or -Infinity.
function craterLavaAt(x, z) {
  for (const v of terrainFns.volcanoes) if (Math.hypot(x - v.x, z - v.z) < v.crater * 0.8) return v.lavaY;
  return -Infinity;
}
// Is a point (feet height y) in lava: the crater lake or a flow? `margin` widens the flows (metres).
function lavaAt(x, y, z, margin = 0) {
  if (y < craterLavaAt(x, z) + 0.4) return true;
  for (const fl of lavaFlows) {
    if (x < fl.minX || x > fl.maxX || z < fl.minZ || z > fl.maxZ) continue;
    const p = fl.pts;
    for (let k = 1; k < p.length; k++) {
      const a = p[k - 1], b = p[k], ex = b.x - a.x, ez = b.z - a.z;
      const t = Math.max(0, Math.min(1, ((x - a.x) * ex + (z - a.z) * ez) / (ex * ex + ez * ez || 1)));
      const d = Math.hypot(x - (a.x + ex * t), z - (a.z + ez * t));
      if (d < (a.w + margin) * 0.95 && y < lerp(a.y, b.y, t) + 0.7 + margin && y > lerp(a.y, b.y, t) - 2.5) return true;
    }
  }
  return false;
}

function updateVolcanoes(dt, time) {
  lavaUniforms.uTime.value = time;
  for (const fx of volcanoFx) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 1.7);
    fx.lavaMat.color.setRGB(1, 0.32 + pulse * 0.12, 0.08);
    fx.light.intensity = 220 + pulse * 80;
    for (const s of fx.smoke) {
      const u = s.userData;
      u.t = (u.t + dt * 0.05) % 1;
      s.position.set(fx.v.x + u.ox * (1 + u.t * 2) + u.t * 25, fx.v.lavaY + 4 + u.t * 70, fx.v.z + u.oz * (1 + u.t * 2));
      s.scale.setScalar((2.5 + u.t * 9) * 2.4);
      s.material.rotation = u.t * u.spin;
      s.material.opacity = 0.55 * Math.sin(Math.PI * Math.min(1, u.t * 1.2));
    }
  }
}

function placeVegetation(seed) {
  const rand = mulberry32(seed * 13 + 5);
  const T = terrainFns, L = T.ledge, W = WORLD.waterLevel;
  const trees = [], bushes = [], rocks = [];
  const step = WORLD.treeSpacing;
  for (let gz = step; gz < WORLD.size - step; gz += step) {
    for (let gx = step; gx < WORLD.size - step; gx += step) {
      const x = gx + (rand() - 0.5) * step * 0.9, z = gz + (rand() - 0.5) * step * 0.9;
      const fm = T.forestMask(x, z), vi = T.volcanoInfluence(x, z);
      const r = rand();
      const wantTree = r < 0.05 + fm * 0.85;
      const wantBush = !wantTree && r < 0.08 + fm * 0.12;
      const wantRock = !wantTree && !wantBush && r > 0.992 - vi * 0.02;
      if (!wantTree && !wantBush && !wantRock) continue;
      if (Math.hypot(x - L.x, z - L.z) < L.r + 3) continue; // keep the cave mouth clear
      const hit = groundAt(x, z);
      if (!hit) continue;
      const y = hit.point.y, ny = hit.face.normal.y;
      if (Math.abs(y - T.surfaceHeight(x, z)) > 4) continue; // not on cave floors
      const wl = T.waterAt(x, z);
      if (wantRock) { if (y > wl + 0.5 && ny > 0.6) rocks.push({ x, y, z, s: 0.6 + rand() * 1.4, rot: rand() * 6.28, iron: rand() < 0.14 }); continue; }
      if (ny < 0.72 || y < wl + (wl > W ? 1.0 : 1.8) || y > 76 || vi > 0.35) continue;
      if (vi > 0.2 && lavaAt(x, y, z, 1.5)) continue;
      const scale = 0.75 + rand() * 0.7;
      if (wantBush) { bushes.push({ x, y, z, s: 0.5 + rand() * 0.6 }); continue; }
      // pines dominate up high, mixed forest lower down
      const pineChance = smoothstep(35, 60, y) * 0.8 + 0.25 + T.noise2(x * 0.02, z * 0.02) * 0.3;
      const kind = rand() < pineChance ? 0 : rand() < 0.75 ? 1 : 2; // 0 pine, 1 oak, 2 birch
      trees.push({ x, y, z, scale, kind, rot: rand() * 6.28, tint: rand() });
    }
  }

  // Shapes: a detailed version for close up and a cheap one for the distance (same instances)
  const low = QUALITY === 'low';
  const near = {
    trunk: new THREE.CylinderGeometry(0.13, 0.27, 1, 10, 1, true).translate(0, 0.5, 0),
    pine: pineTier(1.45, 2.7, low ? 9 : 14, 1),
    crown: leafClump(1.6, 1.35, 1.6, low ? 22 : 40, 1.5, 2),
    birch: leafClump(1.15, 1.2, 1.15, low ? 16 : 28, 1.1, 3),
    bush: leafClump(0.95, 0.75, 0.95, low ? 10 : 18, 0.9, 4),
    rock: boulderGeometry(2),
  };
  const far = {
    trunk: new THREE.CylinderGeometry(0.13, 0.27, 1, 5, 1, true).translate(0, 0.5, 0),
    pine: pineTier(1.45, 2.7, 6, 1),
    crown: leafClump(1.6, 1.35, 1.6, 10, 1.9, 2),
    birch: leafClump(1.15, 1.2, 1.15, 8, 1.4, 3),
    bush: leafClump(0.95, 0.75, 0.95, 5, 1.1, 4),
    rock: boulderGeometry(1),
  };
  const mats = {
    trunk: barkMaterial(), pine: foliageMaterials(true), crown: foliageMaterials(false), birch: foliageMaterials(false),
    bush: foliageMaterials(false), rock: triplanarMaterial(LAYER.rock, { color: 0xb4aea6 }, 1.3),
  };
  const farMats = { pine: foliageMaterials(true, true), crown: foliageMaterials(false, true), birch: foliageMaterials(false, true), bush: foliageMaterials(false, true) };

  // Vegetation is split into square tiles, so whole tiles outside the view or far away can be skipped.
  const n = Math.ceil(WORLD.size / VEG_TILE);
  const tiles = Array.from({ length: n * n }, (_, k) => ({ trees: [], bushes: [], rocks: [], i: k % n, j: Math.floor(k / n) }));
  const tileOf = (o) => tiles[Math.min(n - 1, Math.floor(o.x / VEG_TILE)) + n * Math.min(n - 1, Math.floor(o.z / VEG_TILE))];
  for (const t of trees) tileOf(t).trees.push(t);
  for (const b of bushes) tileOf(b).bushes.push(b);
  for (const r of rocks) tileOf(r).rocks.push(r);
  for (const tile of tiles) if (tile.trees.length || tile.bushes.length || tile.rocks.length) buildVegTile(tile, near, far, mats, farMats);
  return { trees: trees.length, bushes: bushes.length, rocks: rocks.length };
}

const VEG_TILE = 96;        // metres per vegetation tile
const vegTiles = [];        // { near: Group, far: Group, cx, cz }
function buildVegTile({ trees, bushes, rocks, i: ti, j: tj }, nearGeo, farGeo, mats, farMats) {
  const nPine = trees.filter((t) => t.kind === 0).length;
  const nOak = trees.filter((t) => t.kind === 1).length;
  const nBirch = trees.length - nPine - nOak;
  const make = (key, count) => new THREE.InstancedMesh(nearGeo[key], mats[key], Math.max(1, count));
  const trunks = make('trunk', trees.length), pines = make('pine', nPine * 3), crowns = make('crown', nOak * 2);
  const birches = make('birch', nBirch * 2), bushMesh = make('bush', bushes.length), rockMesh = make('rock', rocks.length);

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const col = new THREE.Color();
  let pi = 0, ci = 0, bi = 0;
  trees.forEach((t, i) => {
    const partsOf = [];
    q.setFromAxisAngle(up, t.rot);
    const trunkH = (t.kind === 0 ? 2.2 : t.kind === 1 ? 2.8 : 4.0) * t.scale;
    m.compose(p.set(t.x, t.y - 0.4, t.z), q, s.set(t.scale, trunkH + 0.4, t.scale));
    trunks.setMatrixAt(i, m);
    trunks.setColorAt(i, col.set(t.kind === 2 ? 0xffffff : 0xd8c8b8));
    if (t.kind === 0) {
      for (let l = 0; l < 3; l++) {
        const ls = t.scale * (1 - l * 0.24);
        m.compose(p.set(t.x, t.y + trunkH * 0.45 + l * 1.25 * t.scale, t.z), q, s.set(ls, ls, ls));
        partsOf.push([pines, pi]);
        pines.setMatrixAt(pi, m);
        pines.setColorAt(pi++, col.setHSL(0.36 + t.tint * 0.04, 0.45, 0.22 + t.tint * 0.06));
      }
    } else if (t.kind === 1) {
      m.compose(p.set(t.x, t.y + trunkH + 0.7 * t.scale, t.z), q, s.set(t.scale, t.scale * 0.85, t.scale));
      partsOf.push([crowns, ci]);
      crowns.setMatrixAt(ci, m);
      crowns.setColorAt(ci++, col.setHSL(0.26 + t.tint * 0.06, 0.5, 0.3 + t.tint * 0.08));
      m.compose(p.set(t.x + 0.6 * t.scale, t.y + trunkH + 0.1, t.z + 0.3 * t.scale), q, s.set(t.scale * 0.65, t.scale * 0.6, t.scale * 0.65));
      partsOf.push([crowns, ci]);
      crowns.setMatrixAt(ci, m);
      crowns.setColorAt(ci++, col.setHSL(0.27 + t.tint * 0.05, 0.5, 0.27 + t.tint * 0.08));
    } else {
      for (let l = 0; l < 2; l++) {
        m.compose(p.set(t.x, t.y + trunkH * (0.7 + l * 0.3), t.z), q, s.set(t.scale * (0.9 - l * 0.25), t.scale * (1.3 - l * 0.3), t.scale * (0.9 - l * 0.25)));
        partsOf.push([birches, bi]);
        birches.setMatrixAt(bi, m);
        birches.setColorAt(bi++, col.setHSL(0.2 + t.tint * 0.05, 0.55, 0.42 + t.tint * 0.06));
      }
    }
    const ob = { type: 'cyl', x: t.x, z: t.z, y0: t.y - 0.5, y1: t.y + trunkH + 3, r: 0.27 * t.scale };
    addObstacle(ob);
    const crownY = t.y + trunkH + (t.kind === 0 ? 0.3 : 0.6) * t.scale;
    addTarget({
      kind: 'tree', species: ['pine', 'oak', 'birch'][t.kind], x: t.x, y: t.y, z: t.z, scale: t.scale, obstacle: ob,
      parts: [[trunks, i], ...partsOf], spheres: [[t.x, t.y + 0.6, t.z, 0.5], [t.x, t.y + trunkH * 0.5, t.z, 0.5], [t.x, crownY, t.z, 1.4 * t.scale]],
    });
  });
  bushes.forEach((b, i) => {
    m.compose(p.set(b.x, b.y + 0.3 * b.s, b.z), q.setFromAxisAngle(up, b.x), s.set(b.s * 1.2, b.s * 0.8, b.s * 1.2));
    bushMesh.setMatrixAt(i, m);
    bushMesh.setColorAt(i, col.setHSL(0.27 + hash1(b.x + b.z) * 0.06, 0.45, 0.25 + hash1(b.x * 3 + 7) * 0.08));
    addTarget({ kind: 'bush', x: b.x, y: b.y, z: b.z, parts: [[bushMesh, i]], spheres: [[b.x, b.y + 0.3 * b.s, b.z, 0.95 * b.s]] });
  });
  rocks.forEach((r, i) => {
    if (r.iron) rockMesh.setColorAt(i, col.setHSL(0.05, 0.42, 0.5 + hash1(r.x * 3.1 + r.z) * 0.1)); // rusty: iron inside
    else rockMesh.setColorAt(i, col.setHSL(0.08, 0.06, 0.62 + hash1(r.x * 3.1 + r.z) * 0.2));
    q.setFromEuler(new THREE.Euler(r.rot, r.rot * 2, 0));
    m.compose(p.set(r.x, r.y + r.s * 0.3, r.z), q, s.set(r.s * 1.2, r.s, r.s));
    rockMesh.setMatrixAt(i, m);
    const ob = { type: 'sphere', x: r.x, y: r.y + r.s * 0.3, z: r.z, r: r.s * 0.95 };
    addObstacle(ob);
    addTarget({ kind: 'rock', x: r.x, y: r.y, z: r.z, s: r.s, iron: r.iron, obstacle: ob, parts: [[rockMesh, i]], spheres: [[r.x, r.y + r.s * 0.3, r.z, r.s * 1.05]] });
  });
  pines.count = pi; crowns.count = ci; birches.count = bi;
  trunks.count = trees.length; bushMesh.count = bushes.length; rockMesh.count = rocks.length;

  const nearGroup = new THREE.Group(), farGroup = new THREE.Group();
  for (const [key, im] of [['trunk', trunks], ['pine', pines], ['crown', crowns], ['birch', birches], ['bush', bushMesh], ['rock', rockMesh]]) {
    if (!im.count) continue;
    im.castShadow = true; im.receiveShadow = true;
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.computeBoundingSphere();
    nearGroup.add(im);
    // the distant version shares the instance data, so chopping a tree hides it in both
    const lo = new THREE.InstancedMesh(farGeo[key], farMats[key] || mats[key], im.count);
    lo.instanceMatrix = im.instanceMatrix; lo.instanceColor = im.instanceColor;
    lo.count = im.count; lo.boundingSphere = im.boundingSphere;
    lo.castShadow = false; lo.receiveShadow = true; // distant trees: only the far shadow cascade would see them
    farGroup.add(lo);
  }
  farGroup.visible = false;
  world.add(nearGroup, farGroup);
  vegTiles.push({ near: nearGroup, far: farGroup, cx: (ti + 0.5) * VEG_TILE, cz: (tj + 0.5) * VEG_TILE });
}

const cloudMats = { top: null, under: null };
function addClouds(seed) {
  const rand = mulberry32(seed * 31 + 9);
  clouds = new THREE.Group();
  const mat = new THREE.SpriteMaterial({ map: puffTexture(), color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false, fog: false });
  const shade = new THREE.SpriteMaterial({ map: puffTexture(), color: 0xc4ccd6, transparent: true, opacity: 0.85, depthWrite: false, fog: false });
  cloudMats.top = mat; cloudMats.under = shade;
  const n = Math.min(160, Math.round(22 * (WORLD.size / 256) ** 2));
  for (let i = 0; i < n; i++) {
    const c = new THREE.Group();
    const parts = 6 + Math.floor(rand() * 8), len = 14 + rand() * 22;
    for (let j = 0; j < parts; j++) {
      // a greyer layer underneath, bright puffs on top
      const under = j < parts * 0.35;
      const s = new THREE.Sprite(under ? shade : mat);
      const size = 14 + rand() * 16;
      s.position.set((rand() - 0.5) * len, under ? -2 + rand() * 2 : rand() * 5, (rand() - 0.5) * len * 0.6);
      s.scale.set(size, size * 0.65, 1);
      c.add(s);
    }
    c.position.set(rand() * WORLD.size * 1.6 - WORLD.size * 0.3, WORLD.height + 30 + rand() * 30, rand() * WORLD.size * 1.6 - WORLD.size * 0.3);
    clouds.add(c);
  }
  world.add(clouds);
}

// ---------------------------------------------------------------------------
// Grass blades: tufts of crossed cards around the player, swaying in the wind and shrinking away
// with distance. They take their colour from the grass texture under them, so they blend into the
// ground, and are built in 16 m patches as you walk (and rebuilt when you dig).
// ---------------------------------------------------------------------------
const GRASS_PATCH = 16, GRASS_RADIUS = QUALITY === 'low' ? 28 : 44, GRASS_PER_PATCH = QUALITY === 'low' ? 320 : 620;
const grassGroup = new THREE.Group();
const grassPatches = new Map();  // "i,j" -> InstancedMesh
const grassUniforms = { uWind: { value: 0.3 }, uGrassCam: { value: new THREE.Vector3() } };
let grassGeo = null, grassMat = null;

function grassTexture() {
  return canvasTexture(128, (g, S) => {
    const rand = mulberry32(23);
    for (let i = 0; i < 46; i++) {
      // a blade: a thin curved wedge, darker at its root
      const x0 = S * (0.08 + rand() * 0.84), h = S * (0.45 + rand() * 0.53), lean = (rand() - 0.5) * S * 0.3, w = 2.2 + rand() * 2.6;
      const grd = g.createLinearGradient(0, S, 0, S - h);
      const l = 62 + rand() * 30;
      grd.addColorStop(0, `hsl(85, 20%, ${l * 0.45}%)`); grd.addColorStop(1, `hsl(${70 + rand() * 20}, 25%, ${l}%)`);
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(x0 - w, S);
      g.quadraticCurveTo(x0 - w * 0.5 + lean * 0.3, S - h * 0.6, x0 + lean, S - h);
      g.quadraticCurveTo(x0 + w * 0.5 + lean * 0.3, S - h * 0.6, x0 + w, S);
      g.fill();
    }
  });
}

// three cards crossed at 60 degrees; normals point up, so the tufts are lit like the ground they stand on
function grassGeometry() {
  const pos = [], uv = [], nrm = [], idx = [], W = 0.42, H = 0.55;
  for (let k = 0; k < 3; k++) {
    const a = (k / 3) * Math.PI, c = Math.cos(a) * W, sn = Math.sin(a) * W, b = pos.length / 3;
    pos.push(-c, 0, -sn, c, 0, sn, c, H, sn, -c, H, -sn);
    uv.push(0, 0, 1, 0, 1, 1, 0, 1);
    for (let v = 0; v < 4; v++) nrm.push(0, 1, 0);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

function grassMaterial() {
  const mat = new THREE.MeshStandardMaterial({ map: grassTexture(), alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.92 });
  mat.alphaToCoverage = true;
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, texUniforms, grassUniforms, { uTime: terrainUniforms.uTime });
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        precision highp sampler2DArray;
        uniform sampler2DArray tAlbedo;
        uniform float uTime, uWind;
        uniform vec3 uGrassCam;
        varying vec3 vGrassCol;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec3 root = instanceMatrix[3].xyz;
        // shrink away towards the edge of the grass area, so patches don't pop in
        float fade = 1.0 - smoothstep(${(GRASS_RADIUS * 0.6).toFixed(1)}, ${GRASS_RADIUS.toFixed(1)}, length(root.xz - uGrassCam.xz));
        transformed *= fade;
        float gust = sin(uTime * 1.7 + root.x * 0.35 + root.z * 0.27) + 0.5 * sin(uTime * 3.3 + root.x * 0.9 - root.z * 0.4);
        transformed.xz += vec2(0.9, 0.5) * gust * (0.06 + uWind * 0.2) * uv.y * uv.y;
        // the colour of the grass texture under this tuft (a blurry mip, so a smooth average)
        vGrassCol = textureLod(tAlbedo, vec3(root.xz * ${(1 / TEX_LAYERS[LAYER.grass].size).toFixed(4)}, ${LAYER.grass}.0), 5.0).rgb;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vGrassCol;')
      .replace('#include <map_fragment>', `#include <map_fragment>
        diffuseColor.rgb *= vGrassCol * 1.6;`)
      // both sides of a card face up (a back face would otherwise get a downward normal and go dark)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        normal = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);`);
  };
  return mat;
}

// Ground height under (x, z) from the density field (where it crosses zero), or null.
function fieldSurfaceY(x, z) {
  const h = terrainFns.surfaceHeight(x, z);
  let hi = h + 3, lo = h - 3;
  if (sampleField(x, hi, z) > 0 || sampleField(x, lo, z) < 0) return null; // overhang, or dug away
  for (let k = 0; k < 9; k++) { const mid = (hi + lo) * 0.5; if (sampleField(x, mid, z) > 0) lo = mid; else hi = mid; }
  return (hi + lo) * 0.5;
}

// How much grass grows here (0..1), following the same rules as the ground texture.
const _gn = new THREE.Vector3();
function grassAmount(x, y, z) {
  const T = terrainFns;
  if (y < T.waterAt(x, z) + 1.3 || y > 74) return 0;
  if (T.volcanoInfluence(x, z) > 0.02) return 0;
  fieldNormal(x, y, z, _gn);
  if (_gn.y < 0.8) return 0;
  if (editedMat.size && editedMaterialAt(x, y - 0.8, z)) return 0; // dug or built ground stays bare
  const nb = T.noise2(x * 0.03 + 50, z * 0.03 - 20);
  const forest = smoothstep(0, 1, T.forestMask(x, z) + nb * 0.25);
  return (1 - forest * 0.75) * (1 - smoothstep(50, 70, y)) * smoothstep(0.8, 0.9, _gn.y);
}

function buildGrassPatch(i, j) {
  if (!grassGeo) { grassGeo = grassGeometry(); grassMat = grassMaterial(); }
  const rand = mulberry32((i * 7919 + j * 104729) ^ (worldStats?.seed || 1));
  const im = new THREE.InstancedMesh(grassGeo, grassMat, GRASS_PER_PATCH);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), c = new THREE.Color();
  const T = terrainFns;
  let n = 0;
  for (let k = 0; k < GRASS_PER_PATCH * 1.5 && n < GRASS_PER_PATCH; k++) {
    const x = (i + rand()) * GRASS_PATCH, z = (j + rand()) * GRASS_PATCH, r = rand();
    if (x < 2 || z < 2 || x > WORLD.size - 2 || z > WORLD.size - 2) continue;
    const y = fieldSurfaceY(x, z);
    if (y === null || r > grassAmount(x, y, z)) continue;
    const size = 0.7 + rand() * 0.6, tall = 0.8 + rand() * 0.7;
    m.compose(p.set(x, y - 0.08, z), q.setFromAxisAngle(up, rand() * Math.PI), sc.set(size, size * tall, size));
    im.setMatrixAt(n, m);
    // dry, yellower grass on open sunny patches, as on the ground texture
    const dry = smoothstep(0.35, 0.7, T.noise3(x * 0.06, y * 0.06, z * 0.06) + T.noise2(x * 0.03 + 50, z * 0.03 - 20)) * 0.6;
    const v = 0.85 + rand() * 0.3;
    im.setColorAt(n, c.setRGB(v * (1 + dry * 0.35), v * (1 + dry * 0.1), v * (1 - dry * 0.45)));
    n++;
  }
  im.count = n;
  im.castShadow = false; im.receiveShadow = true;
  im.frustumCulled = true;
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.computeBoundingSphere();
  if (im.boundingSphere) im.boundingSphere.radius += 1;
  return im;
}

// Keeps patches built around (cx, cz); builds at most `budget` new ones per call, nearest first.
function updateGrass(cx, cz, budget = 2) {
  grassUniforms.uGrassCam.value.set(cx, 0, cz);
  const R = GRASS_RADIUS + GRASS_PATCH * 0.75, P = GRASS_PATCH;
  for (const [key, im] of grassPatches) {
    const [i, j] = key.split(',').map(Number);
    if (Math.hypot((i + 0.5) * P - cx, (j + 0.5) * P - cz) > R + P) { grassGroup.remove(im); im.dispose(); grassPatches.delete(key); }
  }
  const want = [];
  for (let j = Math.floor((cz - R) / P); j <= Math.floor((cz + R) / P); j++) for (let i = Math.floor((cx - R) / P); i <= Math.floor((cx + R) / P); i++) {
    if (i < 0 || j < 0 || i * P >= WORLD.size || j * P >= WORLD.size || grassPatches.has(`${i},${j}`)) continue;
    const d = Math.hypot((i + 0.5) * P - cx, (j + 0.5) * P - cz);
    if (d < R) want.push([d, i, j]);
  }
  want.sort((a, b) => a[0] - b[0]);
  for (const [, i, j] of want.slice(0, budget)) {
    const im = buildGrassPatch(i, j);
    litMaterial(im.material);
    grassPatches.set(`${i},${j}`, im);
    grassGroup.add(im);
  }
}
// Drop the patches over an area (rebuilt next frame), after digging or filling ground there.
function invalidateGrass(x0, x1, z0, z1) {
  for (const [key, im] of grassPatches) {
    const [i, j] = key.split(',').map(Number);
    if ((i + 1) * GRASS_PATCH < x0 - 1 || i * GRASS_PATCH > x1 + 1 || (j + 1) * GRASS_PATCH < z0 - 1 || j * GRASS_PATCH > z1 + 1) continue;

function findSpawn() {
  // stand on the ledge in front of the big cave, facing into it
  const t = terrainFns.tunnel;
  const dir = new THREE.Vector3().subVectors(t[2], t[0]).setY(0).normalize();
  for (const back of [7, 6, 8, 5, 9, 4, 10]) {

      return Math.atan2(-dir.x, -dir.z);

// Collision: capsule vs. terrain triangles (BVH), tree trunks and boulders.

const _box = new THREE.Box3(), _seg = new THREE.Line3(), _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _off = new THREE.Vector3();

function applyPush(dir, depth) {

const keys = {};
let yaw = 0, pitch = -0.25;
let thirdPerson = true;
const CAM_DISTANCES = [3.5, 6, 10];
let camDistIndex = 1;
const camState = { dist: 6 };
let gameTime = 0;

function stepPhysics(dt, inputDir, speed) {
  const W = Math.max(terrainFns.waterAt(player.position.x, player.position.z), craterLavaAt(player.position.x, player.position.z));
  const feet = player.position.y - FOOT_OFFSET;
  const depth = W - feet;
  player.inWater = depth > 0.3;
  const swimming = depth > 1.25;

  // gravity (and buoyancy when swimming); creative mode flies
  if (creative) {
    const up = (keys.Space ? 1 : 0) - (keys.ShiftLeft || keys.ShiftRight ? 1 : 0);
    player.velocity.y += (up * PLAYER.flySpeed * 0.8 - player.velocity.y) * (1 - Math.exp(-10 * dt));
  } else if (swimming) {
    player.velocity.y += (PLAYER.gravity * 0.15) * dt;
    player.velocity.y *= 1 - Math.min(1, dt * 2.5);
    if (keys.Space) player.velocity.y = Math.max(player.velocity.y, 3.2);
  } else {
    player.velocity.y += PLAYER.gravity * dt;
  }

  const k = 1 - Math.exp(-(player.onGround || creative ? 16 : swimming ? 5 : 3) * dt);
  player.velocity.x += (inputDir.x * speed - player.velocity.x) * k;
  player.velocity.z += (inputDir.z * speed - player.velocity.z) * k;

  player.position.addScaledVector(player.velocity, dt);
  const fallSpeed = -player.velocity.y;

  contact.ground = contact.steep = contact.slope = contact.ceiling = false;
  contact.steepN.set(0, 0, 0);
  collideCapsule();
  player.position.copy(_seg.start);

  player.onGround = contact.ground;
  // fall damage: hitting the ground faster than after about a 5 m drop hurts, on flat ground and
  // on slopes alike (sliding down a slope is capped below that speed, so it never hurts)
  if ((contact.ground || contact.slope) && fallSpeed > 16 && !player.inWater && !creative) damagePlayer((fallSpeed - 16) * 6, 'fell too far');
  if (contact.ground) {
    player.lastGroundTime = gameTime;
    if (player.velocity.y < 0) player.velocity.y = creative ? 0 : -2.5; // keeps you stuck to the ground going downhill
  }
  if (contact.steep) {
    // remove any velocity pushing into the steep surface (no climbing it)
    const n = contact.steepN;
    const len = Math.hypot(n.x, n.z);
    if (len > 1e-5) {

      if (into < 0) { player.velocity.x -= nx * into; player.velocity.z -= nz * into; }
    }

const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _input = new THREE.Vector3();

function updatePlayer(dt) {
  _fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  _right.set(-_fwd.z, 0, _fwd.x);
  _input.set(0, 0, 0);
  if (!inventoryOpen) {
    if (keys.KeyW || keys.ArrowUp) _input.add(_fwd);
    if (keys.KeyS || keys.ArrowDown) _input.sub(_fwd);
    if (keys.KeyD || keys.ArrowRight) _input.add(_right);
    if (keys.KeyA || keys.ArrowLeft) _input.sub(_right);
  }
  const moving = _input.lengthSq() > 0;
  if (moving) _input.normalize();

  player.sprinting = (keys.ShiftLeft || keys.ShiftRight) && moving && !creative;
  let speed = creative ? PLAYER.flySpeed : player.sprinting ? PLAYER.sprintSpeed : PLAYER.walkSpeed;
  if (player.inWater && !creative) speed *= 0.55;
  if (player.inLava && !creative) speed *= 0.5;

  // jump only from walkable ground (with a short grace period after leaving it)
  const canJump = player.onGround || gameTime - player.lastGroundTime < 0.12;
  if (keys.Space && canJump && !player.inWater && !creative) {
    player.velocity.y = PLAYER.jumpSpeed;
    player.onGround = false;
    player.lastGroundTime = -1;
  }

  const steps = 5;
  for (let i = 0; i < steps; i++) stepPhysics(dt / steps, _input, speed);

  if (player.position.y < -20) respawn();
  // lava burns while you're in it (and a little longer); creative mode just bounces you out
  player.inLava = lavaAt(player.position.x, player.position.y - FOOT_OFFSET, player.position.z);
  if (player.inLava) {
    if (creative) player.velocity.y = 12;
    else burning = Math.max(burning, 3);
  }

  // Character visuals
  if (mouse.left || mouse.right || swingTime > 0) {
    let diff = yaw - player.facing;
    player.facing += Math.atan2(Math.sin(diff), Math.cos(diff)) * Math.min(1, dt * 14);
  } else if (moving) {
    const target = Math.atan2(-_input.x, -_input.z);
    let diff = target - player.facing;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.facing += diff * Math.min(1, dt * 12);
  }
  animateCharacter(dt);

  lantern.position.set(player.position.x, player.position.y + 0.3, player.position.z);
}

  const depth = terrainFns.waterAt(player.position.x, player.position.z) - (player.position.y - FOOT_OFFSET);
  const swimming = !creative && depth > 1.1, flying = creative && !grounded;
  const walk = Math.min(1, hSpeed / 4), run = smoothstep(PLAYER.walkSpeed, PLAYER.sprintSpeed, hSpeed);
  if (!grounded) C.air += dt; else { if (C.air > 0.35) C.land = 0.22; C.air = 0; }
  C.land = Math.max(0, C.land - dt);

      const ph = p + i * Math.PI, s = Math.sin(ph);
      T.hip[i] = s * amp;
      T.knee[i] = -Math.max(0, Math.sin(ph - 1.2)) * (0.75 + run * 0.75) * walk - 0.04;   // knee bends as the leg swings forward
      T.ankle[i] = Math.max(0, -Math.cos(ph)) * 0.25 * walk;
      T.shX[i] = -s * (0.45 + run * 0.4) * walk;                                         // arms swing opposite the legs
      T.elbow[i] = 0.15 + walk * (0.25 + run * 0.9);
      T.shZ[i] = (i ? -1 : 1) * (0.06 + 0.02 * Math.sin(t * 1.6));
    }
    T.spineX = -0.06 * walk - 0.22 * run;
    T.spineY = Math.sin(p) * 0.12 * walk;
    if (C.land > 0) { const k = C.land / 0.22; T.hip = [0.5 * k, 0.5 * k]; T.knee = [-1 * k, -1 * k]; T.spineX -= 0.25 * k; }
  }
  // the head turns and tilts towards where the camera looks (within what a neck can do)
  const look = Math.atan2(Math.sin(yaw - player.facing), Math.cos(yaw - player.facing));
  T.headY += THREE.MathUtils.clamp(look, -1, 1) * 0.8;
  T.headX += THREE.MathUtils.clamp(pitch + 0.25, -0.5, 0.5) * 0.7;
  // swinging a tool: the right arm comes down from over the shoulder, the body twists into it
  if (attacking) {
    const k = C.swing < 0.35 ? C.swing / 0.35 : 1 - (C.swing - 0.35) / 0.65, e = k * k * (3 - 2 * k);
    T.shX[1] = THREE.MathUtils.lerp(-2.7, 0.3, 1 - e); T.elbow[1] = 0.3 + 0.5 * e; T.shZ[1] = -0.15;
    T.spineY += -0.35 * e + 0.2;
  }
  // breathing
  C.spine.scale.y = 1 + Math.sin(t * 2.1) * 0.012;

  const k = 1 - Math.exp(-dt * (attacking ? 22 : 13)), ease = (o, axis, v) => { o.rotation[axis] += (v - o.rotation[axis]) * k; };
  ease(C.root, 'x', T.rootX); ease(C.spine, 'x', T.spineX); ease(C.spine, 'y', T.spineY); ease(C.head, 'x', T.headX); ease(C.head, 'y', T.headY);
  [legL, legR].forEach((L, i) => { ease(L.hip, 'x', T.hip[i]); ease(L.knee, 'x', T.knee[i]); ease(L.ankle, 'x', T.ankle[i]); });
  [armL, armR].forEach((A, i) => { ease(A.shoulder, 'x', T.shX[i]); ease(A.shoulder, 'z', T.shZ[i]); ease(A.elbow, 'x', T.elbow[i]); });

  // body height: a little bob when walking, crouch on landing; lifted when swimming so the head is above water
  const bob = grounded ? Math.abs(Math.sin(p)) * 0.045 * walk - (C.land / 0.22) * 0.12 : 0;
  C.root.position.y = swimming ? 0.7 : bob;
  character.position.set(player.position.x, player.position.y - FOOT_OFFSET, player.position.z);
  character.rotation.y = player.facing;
  character.visible = thirdPerson;

  // what's in the right hand, and armour when worn
  const id = slots[selectedSlot]?.id || null;
  if (id !== C.heldId) {
    C.heldId = id;
    C.held.clear();
    const m = heldItemModel(id);
    if (m) { m.rotation.x = -Math.PI / 2 + 0.25; C.held.add(m); prepareLighting(m); }
    viewModel.setItem(id);
  }
  const arm = stats.armour;
  C.armour.visible = arm > 0;
  if (arm > 0) { C.armour.material.color.set(arm >= 0.5 ? 0xa9afb7 : 0x7a4a26); C.armour.material.metalness = arm >= 0.5 ? 0.75 : 0; C.armour.material.roughness = arm >= 0.5 ? 0.35 : 0.85; }
}

// First person: your right hand and the held item at the bottom right of the view, swinging when you use it.
const viewModel = (() => {
  const g = new THREE.Group();
  const fist = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.1, 0.24), new THREE.MeshStandardMaterial({ color: 0xf0c49a, roughness: 0.8 }));
  fist.position.set(0, -0.02, 0.06);
  const sleeve = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.12, 0.2), new THREE.MeshStandardMaterial({ color: 0xc8463d, roughness: 0.8 }));
  sleeve.position.set(0, -0.02, 0.26);
  const item = new THREE.Group();
  g.add(fist, sleeve, item);
  g.position.set(0.3, -0.27, -0.45);
  g.visible = false;
  camera.add(g);
  scene.add(camera);
  let t = 0;
  return {
    group: g,
    setItem(id) { item.clear(); const m = heldItemModel(id); if (m) { m.rotation.set(-Math.PI / 2 + 0.6, 0.3, 0); m.position.set(0, 0, -0.03); m.scale.setScalar(0.6); item.add(m); prepareLighting(m); } },
    update(dt) {
      g.visible = !thirdPerson && gameState === 'playing';
      if (!g.visible) return;
      const hs = Math.hypot(player.velocity.x, player.velocity.z), grounded = player.onGround;
      t += dt * (grounded ? hs * 1.75 : 0);
      const attacking = swingTime > 0 || (mouse.left && (locked || testMode));
      const sw = attacking ? Math.sin((gameTime * 3.2 % 1) * Math.PI) : 0;
      g.position.set(0.3 + Math.cos(t) * 0.012 * Math.min(1, hs / 4), -0.27 + Math.abs(Math.sin(t)) * 0.012 * Math.min(1, hs / 4) - sw * 0.05, -0.45 - sw * 0.08);
      g.rotation.set(-sw * 0.9, 0.08, sw * 0.2);
    },
  };
})();

const _target = new THREE.Vector3(), _camDir = new THREE.Vector3(), _back = new THREE.Vector3();

function updateCamera(dt) {
  _target.set(player.position.x, player.position.y + EYE_OFFSET, player.position.z);
  if (!thirdPerson) {
    camera.position.copy(_target);
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
    return;
  }
  const want = CAM_DISTANCES[camDistIndex];
  _camDir.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  raycaster.set(_target, _back.copy(_camDir).negate());
  raycaster.far = want + 0.4;
  const hit = raycaster.intersectObjects(colliders, false)[0];
  const wanted = hit ? Math.max(0.4, hit.distance - 0.35) : want;
  camState.dist = wanted < camState.dist ? wanted : camState.dist + (wanted - camState.dist) * Math.min(1, dt * 4);
  camera.position.copy(_target).addScaledVector(_camDir, -camState.dist);
  camera.lookAt(_target);
}

// Inventory + hotbar (items get registered later with game.registerItem)
// ---------------------------------------------------------------------------
const HOTBAR_SIZE = 9, INVENTORY_SIZE = 36; // slots 0-8 are the hotbar, 9-35 the backpack
const ITEMS = {};                            // id -> { id, name, icon (emoji) or color, maxStack }
const slots = new Array(INVENTORY_SIZE).fill(null); // each slot: null or { id, count }
let selectedSlot = 0;
let heldStack = null; // stack on the mouse cursor while the inventory is open
let inventoryOpen = false;

function registerItem(def) {
  ITEMS[def.id] = { maxStack: 64, ...def };
  return ITEMS[def.id];
}

// Adds items, filling existing stacks first (hotbar before backpack). Returns how many didn't fit.
function addItem(id, count = 1) {
  const def = ITEMS[id];
  if (!def) throw new Error(`Unknown item "${id}". Register it with game.registerItem first.`);
  for (const pass of ['stack', 'empty']) {
    for (let i = 0; i < INVENTORY_SIZE && count > 0; i++) {
      const s = slots[i];
      if (pass === 'stack' && s && s.id === id && s.count < def.maxStack) {
        const n = Math.min(count, def.maxStack - s.count); s.count += n; count -= n;
      } else if (pass === 'empty' && !s) {
        const n = Math.min(count, def.maxStack); slots[i] = { id, count: n }; count -= n;
      }
    }
  }
  renderInventory();
  return count;
}

function removeItem(id, count = 1) {
  for (let i = INVENTORY_SIZE - 1; i >= 0 && count > 0; i--) {
    const s = slots[i];
    if (s && s.id === id) { const n = Math.min(count, s.count); s.count -= n; count -= n; if (!s.count) slots[i] = null; }
  }
  renderInventory();
  return count === 0;
}

const countItem = (id) => slots.reduce((sum, s) => sum + (s && s.id === id ? s.count : 0), 0);
const getSelectedItem = () => slots[selectedSlot];

function fillSlotEl(el, stack, keyLabel) {
  el.innerHTML = keyLabel ? `<span class="key">${keyLabel}</span>` : '';
  el.removeAttribute('title');
  if (!stack) return;
  const def = ITEMS[stack.id] || { name: stack.id };
  if (def.icon) el.insertAdjacentHTML('beforeend', `<span>${def.icon}</span>`);
  else el.insertAdjacentHTML('beforeend', `<span class="swatch${def.flat ? ' flat' : ''}" style="background:${def.color || '#999'}"></span>`);
  if (def.badge) el.insertAdjacentHTML('beforeend', `<span class="badge" style="background:${def.badge}"></span>`);
  if (stack.count > 1) el.insertAdjacentHTML('beforeend', `<span class="count">${stack.count}</span>`);
  el.dataset.name = def.name;
}

const hotbarEl = document.getElementById('hotbar');
const invMainEl = document.getElementById('inv-main');
const invHotbarEl = document.getElementById('inv-hotbar');
const inventoryEl = document.getElementById('inventory');
const heldEl = document.getElementById('held');
const tooltipEl = document.getElementById('tooltip');

function makeSlots(container, from, to, interactive) {
  for (let i = from; i < to; i++) {
    const el = document.createElement('div');
    el.className = 'slot';
    el.dataset.index = i;
    if (interactive) {
      el.addEventListener('mousedown', (e) => { e.preventDefault(); onSlotClick(i, e); });
      el.addEventListener('mouseenter', () => { const s = slots[i]; if (s) showTooltip(s.id); });
      el.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });
      el.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    container.appendChild(el);
  }
}
makeSlots(hotbarEl, 0, HOTBAR_SIZE, false);
makeSlots(invMainEl, HOTBAR_SIZE, INVENTORY_SIZE, true);
makeSlots(invHotbarEl, 0, HOTBAR_SIZE, true);

function renderInventory() {
  [...hotbarEl.children].forEach((el, i) => { fillSlotEl(el, slots[i], String(i + 1)); el.classList.toggle('selected', i === selectedSlot); });
  [...invMainEl.children].forEach((el) => fillSlotEl(el, slots[+el.dataset.index]));
  [...invHotbarEl.children].forEach((el) => fillSlotEl(el, slots[+el.dataset.index], el.dataset.index * 1 + 1 + ''));
  fillSlotEl(heldEl, heldStack);
  heldEl.style.display = heldStack ? 'flex' : 'none';
  document.getElementById('inv-note').style.display = slots.some(Boolean) || heldStack ? 'none' : 'block';
  if (inventoryOpen) renderCrafting();
}

function showTooltip(id) {
  const def = ITEMS[id];
  tooltipEl.innerHTML = `<b>${def?.name || id}</b>${def && itemHint(def) ? '<br>' + itemHint(def) : ''}`;
  tooltipEl.style.display = 'block';
}

function onSlotClick(i, e) {
  const s = slots[i];
  const max = (id) => ITEMS[id]?.maxStack ?? 64;
  if (e.button === 0 && e.shiftKey && s && !heldStack) {
    // quick move between hotbar and backpack
    const [from, to] = i < HOTBAR_SIZE ? [HOTBAR_SIZE, INVENTORY_SIZE] : [0, HOTBAR_SIZE];
    for (let j = from; j < to && slots[i]; j++) {
      const t = slots[j];
      if (t && t.id === s.id && t.count < max(s.id)) { const n = Math.min(s.count, max(s.id) - t.count); t.count += n; s.count -= n; if (!s.count) slots[i] = null; }
    }
    for (let j = from; j < to && slots[i]; j++) if (!slots[j]) { slots[j] = slots[i]; slots[i] = null; }
  } else if (e.button === 0) {
    if (!heldStack) { heldStack = s; slots[i] = null; }
    else if (!s) { slots[i] = heldStack; heldStack = null; }
    else if (s.id === heldStack.id) {
      const n = Math.min(heldStack.count, max(s.id) - s.count);
      s.count += n; heldStack.count -= n;
      if (!heldStack.count) heldStack = null;
    } else { slots[i] = heldStack; heldStack = s; }
  } else if (e.button === 2) {
    if (!heldStack && s) {
      const half = Math.ceil(s.count / 2);
      heldStack = { id: s.id, count: half }; s.count -= half;
      if (!s.count) slots[i] = null;
    } else if (heldStack && (!s || (s.id === heldStack.id && s.count < max(s.id)))) {
      if (!s) slots[i] = { id: heldStack.id, count: 1 }; else s.count++;
      if (!--heldStack.count) heldStack = null;
    }
  }
  renderInventory();
}

document.addEventListener('mousemove', (e) => {
  heldEl.style.left = e.clientX - 24 + 'px'; heldEl.style.top = e.clientY - 24 + 'px';
  tooltipEl.style.left = e.clientX + 14 + 'px'; tooltipEl.style.top = e.clientY + 14 + 'px';
});

function selectSlot(i) {
  selectedSlot = (i + HOTBAR_SIZE) % HOTBAR_SIZE;
  renderInventory();
  const s = slots[selectedSlot];
  if (s) toast(ITEMS[s.id]?.name || s.id);
}

function setInventoryOpen(open) {
  inventoryOpen = open;
  inventoryEl.style.display = open ? 'block' : 'none';
  tooltipEl.style.display = 'none';
  if (open) {
    for (const k in keys) keys[k] = false;
    mouse.left = mouse.right = false;
    document.exitPointerLock?.();
  } else {
    if (heldStack) { const left = addItem(heldStack.id, heldStack.count); heldStack = null; if (left) console.warn('Inventory full, items lost:', left); }
    renderInventory();
    renderer.domElement.requestPointerLock()?.catch?.(() => {});
  }
  renderInventory();
  updateOverlay();
}
renderInventory();

// How many of an item would still fit in the inventory.
function roomFor(id) {
  const max = ITEMS[id].maxStack;
  return slots.reduce((n, s) => n + (!s ? max : s.id === id ? max - s.count : 0), 0);
}

function stationsNear() {
  const near = new Set();
  const fx = player.position.x, fy = player.position.y - FOOT_OFFSET, fz = player.position.z;
  for (const b of blocks.values()) {
    if (BLOCKS[b.type].station && Math.hypot(b.x + 0.5 - fx, b.y + 0.5 - fy, b.z + 0.5 - fz) < 4.5) near.add(b.type);
  }
  return near;
}

function canCraft(r, near) {
  if (r.at && !near.has(r.at)) return false;
  return Object.entries(r.in).every(([id, n]) => countItem(id) >= n);
}

function craft(r, all) {
  const near = stationsNear();
  let made = 0;
  do {
    if (!canCraft(r, near)) break;
    if (roomFor(r.out) < (r.n || 1)) { toast('Inventory full'); break; }
    for (const [id, n] of Object.entries(r.in)) removeItem(id, n);
    addItem(r.out, r.n || 1);
    made++;

      im.getMatrixAt(last, _bm); im.setMatrixAt(b.idx, _bm);
      im.getColorAt(last, _bc); im.setColorAt(b.idx, _bc);
    }
    blocks.get(lastKey).idx = b.idx;
    bt.keys[b.idx] = lastKey;
  }
  bt.keys.pop();
  for (const im of bt.meshes) { im.count = last; im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true; }
  for (const o of b.obstacles) gridRemove(obstacleGrid, o);
  blocks.delete(key);
  return b;
}

function updateCampfires(time) {
  const bt = blockGroups['campfire|block'];
  if (!bt || !bt.keys.length) return;
  const flame = bt.meshes[1];
  bt.keys.forEach((key, i) => {
    const b = blocks.get(key);
    const f = 0.85 + Math.sin(time * 11 + i * 3) * 0.12 + Math.sin(time * 17.3 + i) * 0.08;
    _bm.makeScale(1, f, 1).setPosition(b.x + 0.5, b.y, b.z + 0.5);
    flame.setMatrixAt(i, _bm);
  });
  flame.instanceMatrix.needsUpdate = true;
}

// Walks the block grid along a ray (Amanatides & Woo). Returns the first block hit with the face normal.
function voxelRay(o, d, t0, t1) {
  const px = o.x + d.x * t0, py = o.y + d.y * t0, pz = o.z + d.z * t0;
  let x = Math.floor(px), y = Math.floor(py), z = Math.floor(pz);
  const sx = Math.sign(d.x), sy = Math.sign(d.y), sz = Math.sign(d.z);
  const tdx = sx ? Math.abs(1 / d.x) : Infinity, tdy = sy ? Math.abs(1 / d.y) : Infinity, tdz = sz ? Math.abs(1 / d.z) : Infinity;
  let tmx = sx ? t0 + (sx > 0 ? x + 1 - px : px - x) * tdx : Infinity;
  let tmy = sy ? t0 + (sy > 0 ? y + 1 - py : py - y) * tdy : Infinity;
  let tmz = sz ? t0 + (sz > 0 ? z + 1 - pz : pz - z) * tdz : Infinity;
  let t = t0, n = [0, 0, 0];
  for (let i = 0; i < 64 && t <= t1; i++) {
    const key = blockKey(x, y, z);
    if (blocks.has(key)) return { key, t, normal: n, cell: [x, y, z] };
    if (tmx < tmy && tmx < tmz) { x += sx; t = tmx; tmx += tdx; n = [-sx, 0, 0]; }
    else if (tmy < tmz) { y += sy; t = tmy; tmy += tdy; n = [0, -sy, 0]; }
    else { z += sz; t = tmz; tmz += tdz; n = [0, 0, -sz]; }
  }
  return null;
}

// ---------------------------------------------------------------------------
// Health, hunger, thirst and mana
// ---------------------------------------------------------------------------
let creative = false;
const MAX_HEALTH = 150;
const stats = { health: MAX_HEALTH, hunger: 100, thirst: 100, mana: 100, armour: 0 };
const fullStats = () => ({ health: MAX_HEALTH, hunger: 100, thirst: 100, mana: 100 });
let regenTimer = 0, starveTimer = 0, thirstTimer = 0, burning = 0, burnTimer = 0;
const BOLT_COST = 15;

function damagePlayer(amount, reason) {
  if (creative || amount <= 0 || stats.health <= 0 || gameState !== 'playing') return;
  stats.health -= amount * (1 - stats.armour);
  flashDamage();
  if (stats.health <= 0) die(reason);
}

function die(reason) {
  burning = 0;
  toast(`You ${reason}. Back to the start, you keep your things.`);
  Object.assign(stats, fullStats());
  respawn();
}

// Starting supplies for a new survival game
function giveStarterKit() {
  addItem('bread', 4); addItem('apple', 3); addItem('cooked_meat', 2); addItem('water_bottle', 3);
}

function updateStats(dt) {
  if (creative) { Object.assign(stats, fullStats()); return; }
  // food: about 15 minutes from full to empty standing still; sprinting burns it 3x faster
  const drain = (player.sprinting ? 3 : 1) * (player.inWater ? 1.5 : 1) * 100 / 900;
  stats.hunger = Math.max(0, stats.hunger - drain * dt);
  // water: about 10 minutes; faster when sprinting or near a volcano's heat
  const heat = terrainFns.volcanoInfluence(player.position.x, player.position.z) > 0.3 ? 2 : 1;
  stats.thirst = Math.max(0, stats.thirst - (player.sprinting ? 2 : 1) * heat * (100 / 600) * dt);
  stats.mana = Math.min(100, stats.mana + 3 * dt);
  if (stats.hunger <= 0) {
    starveTimer += dt;
    if (starveTimer > 1.5) { starveTimer = 0; damagePlayer(2, 'starved'); }
  }
  // fire: 24 health a second in lava, 6 a second while still burning after stepping out; water puts it out
  if (player.inWater && !player.inLava) burning = 0;
  if (burning > 0) {
    burning -= dt; burnTimer += dt;
    if (burnTimer > 0.25) { burnTimer = 0; damagePlayer(player.inLava ? 6 : 1.5, 'burned to death in the lava'); }
  }
  if (stats.thirst <= 0) {
    thirstTimer += dt;
    if (thirstTimer > 1.5) { thirstTimer = 0; damagePlayer(2, 'died of thirst'); }
  }
  if (stats.hunger > 45 && stats.thirst > 30 && stats.health < MAX_HEALTH) {
    regenTimer += dt; // a well-fed, watered player heals slowly
    if (regenTimer > 0.6) { regenTimer = 0; stats.health = Math.min(MAX_HEALTH, stats.health + 1); stats.hunger -= 0.25; stats.thirst -= 0.15; }
  }
}
