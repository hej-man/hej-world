<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain World</title>
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js"
  }
}
</script>
</head>
<body>
<div id="menu">
  <div class="panel" id="title-panel">
    <h1>Terrain World</h1>
    <div class="sub">Survive, build and explore</div>
    <div id="loading">Generating the world…</div>
    <button class="big primary" id="btn-continue" style="display:none">Continue</button>
    <button class="big primary" id="btn-survival" disabled>New game: Survival</button>
    <button class="big" id="btn-creative" disabled>New game: Creative</button>
    <div class="row"><label>World seed</label><input id="seed-input" inputmode="numeric"><button class="small" id="btn-random" title="Random seed">🎲</button><button class="small" id="btn-newworld">Make</button></div>
    <div class="row"><label>Graphics</label><select id="quality-select"><option value="high">High</option><option value="low">Low (faster)</option></select></div>
    <div class="row"><label>Sound</label><select id="sound-select"><option value="on">On</option><option value="off">Off</option></select></div>
    <details><summary>Controls</summary><div class="controls"></div></details>
  </div>
  <div class="panel" id="pause-panel" style="display:none">
    <h1>Paused</h1>
    <div class="sub" id="pause-info"></div>
    <button class="big primary" id="btn-resume">Resume</button>
    <button class="big" id="btn-mainmenu">Main menu</button>
    <details><summary>Controls</summary><div class="controls"></div></details>
  </div>
</div>
<template id="controls-text">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>Space</kbd> jump / swim up (<kbd>Shift</kbd> dives)<br>
  Mouse look &nbsp; <kbd>V</kbd> first / third person &nbsp; <kbd>Z</kbd> camera distance<br>
  Left click: break / attack &nbsp; Right click: place / eat / drink / use<br>
  Right click on water: drink, or fill an empty bottle<br>
  <kbd>1</kbd>–<kbd>9</kbd> or wheel: hotbar &nbsp; <kbd>E</kbd> inventory + crafting<br>
  <kbd>G</kbd> creative mode (fly: <kbd>Space</kbd> up, <kbd>Shift</kbd> down)<br>
  <kbd>B</kbd> building shape: block, slab, slope, stairs, roof prism, pillar<br>
  <kbd>T</kbd> tip it: upright, on its side, upside down (it turns the way you look)<br>
  <kbd>K</kbd> change the weather (creative) &nbsp; <kbd>M</kbd> sound on / off<br>
  <kbd>F</kbd> lantern &nbsp; <kbd>R</kbd> respawn &nbsp; <kbd>Esc</kbd> pause
</template>
<div id="flash"></div>
<div id="underwater"></div>
<div id="hud"></div>
<div id="crosshair"></div>
<div id="target"></div>
<div id="breakbar"><i></i></div>
<div id="toast"></div>
<div id="damage"></div>
<div id="stats">
  <div class="bar" id="hp"><i></i><span>Health</span></div>
  <div class="bar" id="food"><i></i><span>Hunger</span></div>
  <div class="bar" id="water"><i></i><span>Thirst</span></div>
  <div class="bar" id="mana"><i></i><span>Mana</span></div>
</div>
<div id="mode">CREATIVE</div>
<div id="hotbar"></div>
<div id="inventory">
  <div class="cols">
    <div>
      <h2>Inventory <span>click to move · right-click to split · shift-click to quick move</span></h2>
      <div class="grid" id="inv-main"></div>
      <div class="sep"></div>
      <div class="grid" id="inv-hotbar"></div>
      <div class="empty-note" id="inv-note">Nothing collected yet. Break trees, bushes, rocks and ground to collect things.</div>
    </div>
    <div id="craft">
      <h3 id="craft-title">Crafting <span id="stations"></span></h3>
      <div id="recipes"></div>
      <div id="palette" style="display:none"></div>
    </div>
  </div>
</div>
<div id="held" class="slot"></div>
<div id="tooltip"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
